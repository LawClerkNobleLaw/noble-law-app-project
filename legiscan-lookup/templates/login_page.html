<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Rotunda</title>
<link rel="stylesheet" href="{{STYLE_HREF}}">
{{FONT_LINKS}}
{{THEME_INIT_SCRIPT}}
</head>
<body>
{{top_nav}}
<main>
<div class="wrap auth-wrap">
  <span class="brand-mark auth-mark" style="width:44px;height:44px" aria-hidden="true"></span>
  <h1>Welcome back.</h1>
  <p class="auth-sub">Sign in to pick up where you left off under the dome.</p>

  <div class="card auth-card">
    <form id="f" style="margin:0">
      <label style="flex:1 1 100%">
        <div class="field-label">Email</div>
        <input id="email" type="email" placeholder="you@firm.com" autocomplete="email" required style="width:100%">
      </label>
      <label style="flex:1 1 100%">
        <div class="field-label">Password</div>
        <div style="display:flex;gap:0.5rem">
          <input id="password" type="password" autocomplete="current-password" required style="width:100%">
          <button type="button" id="toggle-password" class="secondary" aria-pressed="false" aria-label="Show password" style="flex:none">Show</button>
        </div>
      </label>
      <button type="submit" class="auth-submit">Sign in</button>
    </form>
  </div>

  <div id="loading" role="status"><span class="spinner"></span>Logging in…</div>
  <div id="error" role="alert" aria-live="assertive"></div>

  <p class="auth-alt">New to Rotunda? <a href="/signup">Create an account</a></p>
</div>
</main>

<script>
const togglePasswordBtn = document.getElementById('toggle-password');
const passwordInput = document.getElementById('password');
togglePasswordBtn.addEventListener('click', () => {
  const show = passwordInput.type === 'password';
  passwordInput.type = show ? 'text' : 'password';
  togglePasswordBtn.textContent = show ? 'Hide' : 'Show';
  // The visible word stays one word; the accessible name says what it
  // is a word about. Out of context "Show, toggle button" is a button
  // that shows something unspecified.
  togglePasswordBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  togglePasswordBtn.setAttribute('aria-pressed', show ? 'true' : 'false');
});
const form = document.getElementById('f');
const errorEl = document.getElementById('error');
const loadingEl = document.getElementById('loading');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  errorEl.className = ''; loadingEl.className = 'show';
  form.querySelector('button').disabled = true;

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not log in');
    // ?next=... is set by _redirect_to_login() (see app.py) whenever
    // a logged-out visitor got bounced here from a page they were
    // actually trying to use — e.g. "+ Add as client" from Organization
    // Search. Only ever followed if it's a same-site path (starts with
    // "/" but not "//", which browsers treat as protocol-relative to
    // another host) — anything else falls back to /flagged rather than
    // risk turning this into an open redirect.
    const next = new URLSearchParams(window.location.search).get('next');
    window.location.href = (next && next.startsWith('/') && !next.startsWith('//')) ? next : '/dashboard';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
    loadingEl.className = '';
    form.querySelector('button').disabled = false;
  }
});
</script>
</body>
</html>
