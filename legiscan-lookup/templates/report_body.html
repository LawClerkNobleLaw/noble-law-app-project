
<div class="page-head"><div><a href="/flagged" class="sub" id="back-link">← Flagged bills</a></div></div>
<div id="error" role="alert" aria-live="assertive"></div>
<div id="loading" class="skeleton show">
  <div class="card">
    <div class="skeleton-bar" style="width:18%;height:1.4rem;margin-bottom:0.6rem"></div>
    <div class="skeleton-bar" style="width:22%;height:0.9rem;margin-bottom:0.8rem"></div>
    <div class="skeleton-bar" style="width:70%;height:1.1rem;margin-bottom:0.5rem"></div>
    <div class="skeleton-bar" style="width:55%"></div>
  </div>
</div>
<div id="report"></div>

<script src="{{HEARING_TIME_SRC}}"></script>
<script src="{{BILL_STATUS_SRC}}"></script>
<script src="{{TOAST_SRC}}"></script>
<script src="{{POSITION_HISTORY_SRC}}"></script>
<script src="{{BILL_TABLES_SRC}}"></script>
<script src="{{CLIENT_QUICKADD_SRC}}"></script>
<script src="{{CONFIRM_DELETE_SRC}}"></script>
<script src="{{TITLE_CASE_SRC}}"></script>
<script src="{{BILL_CLIENTS_SRC}}"></script>
<script>
const reportEl = document.getElementById('report');
const errorEl = document.getElementById('error');
const billId = new URLSearchParams(window.location.search).get('bill_id');

// The back link and sidebar highlight above are baked at import time as
// "Flagged bills" (see REPORT_PAGE below and app_shell()'s own
// docstring on why every page constant here is built once, not
// per-request) — a fine default, since Flagged Bills is this page's
// most common entry point, but a search result from /lookup or a
// client's own bill list land here too. When the link that brought us
// here passed from_label/from_href (see LOOKUP_BODY's and
// CLIENT_DETAIL_BODY's report links), swap both to match instead of
// always claiming Flagged Bills. No params → today's baked default,
// unchanged.
(function() {
  const params = new URLSearchParams(window.location.search);
  const fromLabel = params.get('from_label');
  const fromHref = params.get('from_href');
  if (!fromLabel || !fromHref) return;
  const backLink = document.getElementById('back-link');
  backLink.href = fromHref;
  backLink.textContent = '← ' + fromLabel;
  // First path segment match (e.g. /clients/detail?id=5 -> "clients"
  // matches the sidebar's /clients item) rather than a strict equality
  // check, since fromHref can point at a sub-page of a top-level section.
  const fromSection = fromHref.split('?')[0].split('/')[1] || '';
  const navItem = Array.from(document.querySelectorAll('.side-nav-item[data-nav]'))
    .find(a => (a.dataset.nav.split('/')[1] || '') === fromSection);
  if (navItem) {
    document.querySelectorAll('.side-nav-item.active').forEach(a => a.classList.remove('active'));
    navItem.classList.add('active');
    // If navItem sits inside a (possibly collapsed) Bills/Lobbying
    // Activity/Draft group — see render_group() in app_shell() — open
    // its ancestor .nav-group too, or the newly-active item would be
    // marked correctly but stay visually hidden. Flat top-level items
    // (Dashboard) have no such ancestor and need no unfolding, hence
    // the guard rather than an unconditional classList.add.
    const group = navItem.closest('.nav-group');
    if (group) {
      group.classList.add('open');
      const parentBtn = group.querySelector('.side-nav-parent');
      if (parentBtn) parentBtn.setAttribute('aria-expanded', 'true');
    }
  }
})();

// Every client this user has, for the "+ Add client" picker. Fetched
// alongside the report itself — this page used to need only the clients
// already on the bill, since it couldn't change them.
let allClients = [];

// The same client-chip/position/add-client control the flagged list
// renders (see bill_clients.js). The rule this page now follows: any
// action available on a bill row is available on the bill page.
initBillClients({
  allClients: () => allClients,
  assignedClients: () => (currentReport ? (currentReport.assigned_clients || []) : []),
  billLabel: () => (currentReport ? `${currentReport.state} ${currentReport.bill_number}` : ''),
  onError: (message) => {
    errorEl.textContent = message || '';
    errorEl.className = message ? 'show' : '';
  },
  onChanged: (updatedClients) => {
    if (updatedClients) allClients = updatedClients;
    load();
  },
});
// Set by render() each time a report loads — the flag-confirmation
// modal below reads this instead of re-fetching, same role `current`
// played in the old /lookup page this modal moved here from (see
// LOOKUP_BODY's own comment on why: /report is now the one place bill
// detail, and flagging, actually happen — a search result routes
// straight here whether or not it's ever been flagged before).
let currentReport = null;
let billLetters = [];

async function load() {
  if (!billId) {
    errorEl.textContent = 'Missing bill_id in the URL.';
    errorEl.className = 'show';
    document.getElementById('loading').className = '';
    return;
  }
  try {
    const [reportRes, clientsRes, lettersRes] = await Promise.all([
      fetch(`/api/report?bill_id=${billId}`),
      fetch('/api/clients'),
      fetch(`/api/letters?bill_id=${billId}`),
    ]);
    if (reportRes.status === 401) { window.location.href = '/login'; return; }
    const data = await reportRes.json();
    if (!reportRes.ok) throw new Error(data.error || 'Could not load report');
    // A signed-out visitor can still reach a report, so an unauthorized
    // client list isn't an error here — it just means no picker.
    allClients = clientsRes.ok ? await clientsRes.json() : [];
    // Same tolerance as the client list above: a signed-out visitor can
    // reach a report, and has no letters.
    billLetters = lettersRes.ok ? await lettersRes.json() : [];
    render(data);
    markViewed(data);
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  } finally {
    document.getElementById('loading').className = '';
  }
}

// The button PR #38 had to leave out: Draft > Letters didn't exist yet,
// so it would have had nothing to open. Seeds from this bill, its first
// assigned client's position, and its next hearing (see
// letter_drafts.build_seed) and goes straight to the editor.
//
// One assigned client is the common case and is used without asking.
// With several, the letters page's own picker is the right place to
// choose — this button is a shortcut, not a form.
async function draftLetter() {
  const assigned = (currentReport && currentReport.assigned_clients) || [];
  if (assigned.length > 1) {
    window.location.href = '/draft/letters';
    return;
  }
  errorEl.className = '';
  try {
    const res = await fetch('/api/letters', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        bill_id: Number(billId),
        client_id: assigned.length ? assigned[0].id : null,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not start that letter');
    window.location.href = `/draft/letters/edit?id=${data.id}`;
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  }
}

// Clearing this bill's unread dot on the flagged list. Fired after the
// report has actually rendered — a load that threw never gets here, so a
// failed page doesn't count as having been read.
//
// Deliberately unawaited and deliberately silent on failure: this is
// bookkeeping about what the user has seen, and an error toast about it
// would be louder than the thing it's reporting. Nothing on this page
// depends on the response.
function markViewed(report) {
  if (!report || !report.flagged) return;
  fetch('/api/bill-viewed', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ bill_id: Number(billId) }),
  }).catch(() => {});
}

// The highlighted "Current Status" callout above the full history
// table — just the single most recent bill_status_history row (that
// array already comes back newest-first, see db.get_bill_report()),
// not a separate query. milestoneClass() is the same function that
// colors the history table's own rows further down, reused here so
// this card's left-edge accent means the same thing that table already
// established (see the CSS comment on .current-status-card).
function currentStatusCardHtml(history, amendByDate) {
  const latest = (history || [])[0];
  if (!latest) return '';
  return `
    <div class="current-status-card ${milestoneClass(latest.action)}">
      <div class="current-status-label">Latest action</div>
      <div class="current-status-action">${latest.action || 'Unknown'}</div>
      <div class="current-status-meta">${[fmtShortDate(latest.date), latest.chamber].filter(Boolean).join(' · ')}</div>
      <div class="current-status-amend-by">
        <label for="amend-by-input">Your amendment deadline</label>
        <div class="sub">A reminder you set. Nothing is filed from it — it shows up in Next action on your flagged list.</div>
        <input type="date" id="amend-by-input" value="${amendByDate || ''}"
               onchange="saveAmendByDate(this)">
        <div class="sub" id="amend-by-status" aria-live="polite"></div>
      </div>
    </div>
  `;
}

// "Aug 25" — same shape the flagged list prints dates in, so the header's
// "since" date and this card's "Latest action" date can be read against
// each other without one of them being an ISO string.
function fmtShortDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return dateStr;
  const opts = { month: 'short', day: 'numeric' };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString('en-US', opts);
}

// Saves on change (no separate Save button — a date input's own picker
// already commits the value with one action), same disable/revert/
// reload-on-success shape as setPosition() above it in this same file.
// It does say "Saved." underneath, though: this is a date field on a
// compliance screen, and a value that vanishes into no confirmation is
// one a user reasonably assumes didn't take.
// Not synced from LegiScan — see bills.amend_by_date in schema.sql for
// why this field exists at all only as a manual entry.
async function saveAmendByDate(inputEl) {
  const newValue = inputEl.value;
  const savedValue = inputEl.defaultValue;
  const statusEl = document.getElementById('amend-by-status');
  errorEl.className = '';
  inputEl.disabled = true;
  if (statusEl) statusEl.textContent = 'Saving…';
  try {
    const res = await fetch('/api/bill-amend-by-date', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bill_id: Number(billId), amend_by_date: newValue }),
    });
    if (!res.ok) {
      const data = await res.json();
      throw new Error(data.error || 'Could not save the amendment deadline.');
    }
    inputEl.defaultValue = newValue;
    inputEl.disabled = false;
    if (statusEl) statusEl.textContent = newValue ? 'Saved.' : 'Cleared.';
  } catch (err) {
    inputEl.value = savedValue;
    inputEl.disabled = false;
    if (statusEl) statusEl.textContent = '';
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  }
}

// The note goes back into a <textarea>, so only "</textarea>" can break
// out — but &, < and > are escaped anyway rather than relying on that
// being the only case for however long this markup stays as it is.
function escapeNotes(text) {
  return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Saves on blur rather than per keystroke — a note is written in one
// sitting, and the status line below says so instead of leaving the user
// guessing whether it took.
async function saveNotes(textareaEl) {
  const statusEl = document.getElementById('notes-status');
  if (textareaEl.value === textareaEl.defaultValue) return;
  errorEl.className = '';
  statusEl.textContent = 'Saving…';
  try {
    const res = await fetch('/api/bill-notes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bill_id: Number(billId), notes: textareaEl.value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not save your notes.');
    textareaEl.defaultValue = textareaEl.value;
    if (currentReport) currentReport.notes = data.notes;
    statusEl.textContent = 'Saved.';
  } catch (err) {
    statusEl.textContent = '';
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  }
}

// Unflagging drops this user's positions and notes on the bill, so the
// confirmation names what goes with it — same confirmDelete() the
// flagged list uses, rather than the browser's own confirm().

/* Muting is the small answer to "this bill is being tracked for the
 * record and I do not need mail about it" — the answer that used to be
 * unflagging, which loses the tracking too. Per person, not per firm:
 * see digest_mutes in schema.sql. Settings live on Profile; this is the
 * one place a bill can actually be muted, since it is the only screen
 * where you are looking at the bill you are tired of hearing about.
 */
async function toggleMute() {
  const btn = document.getElementById('mute-btn');
  const r = currentReport;
  if (!r) return;
  const next = !r.digest_muted;
  btn.disabled = true;
  try {
    const res = await fetch('/api/digest-mute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bill_id: r.bill_id, muted: next }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not change that');
    r.digest_muted = data.muted;
    btn.textContent = data.muted ? '\u{1F515} Muted in digest' : 'Mute in digest';
    btn.title = data.muted
      ? 'Start emailing me about this bill again'
      : 'Stop emailing me about this bill — it stays flagged';
    showToast(data.muted
      ? 'Muted. This bill stays flagged; the digest just stops mentioning it.'
      : 'Unmuted. The digest will mention this bill again.');
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  } finally {
    btn.disabled = false;
  }
}

async function unflag() {
  const r = currentReport;
  const label = r ? `${r.state} ${r.bill_number}` : 'this bill';
  const assigned = (r && r.assigned_clients) || [];
  const cost = [];
  if (assigned.length) {
    cost.push(`${assigned.length === 1 ? 'its assigned client and saved position' : `its ${assigned.length} assigned clients and saved positions`}`);
  }
  if (r && r.notes) cost.push('your notes');
  const ok = await confirmDelete('Unflag this bill?', `Unflag ${label}? It stops being checked daily and moves to Archived on your flagged list${cost.length ? ` — ${cost.join(' and ')} come along` : ''}. Restore it anytime from there.`);
  if (!ok) return;
  errorEl.className = '';
  try {
    const res = await fetch(`/api/flag?bill_id=${billId}`, { method: 'DELETE' });
    if (!res.ok) {
      const data = await res.json();
      throw new Error(data.error || 'Could not unflag bill');
    }
    load();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  }
}

// Restoring is exactly flagging again (see db.flag_bill's ON CONFLICT
// clause) — the bill's client assignments, positions and notes were
// never touched by archiving, so there's nothing left to ask for. No
// modal: openFlagModal() is for a bill this user has never flagged,
// where the client/position picker is genuinely new information. And no
// LegiScan round trip either — /api/flag/restore skips the fresh-detail
// fetch openFlagModal's POST /api/flag needs for a brand-new flag,
// since this bill was already being refreshed daily right up until it
// was archived.
async function restore() {
  if (!currentReport) return;
  errorEl.className = '';
  try {
    const res = await fetch('/api/flag/restore', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bill_id: currentReport.bill_id }),
    });
    if (res.status === 401) {
      window.location.href = `/login?next=${encodeURIComponent(window.location.pathname + window.location.search)}`;
      return;
    }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not restore this bill');
    showToast('Restored — back on your flagged list, with its client(s) and notes intact.');
    load();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  }
}

function render(r) {
  currentReport = r;
  const historyRows = historyRowsHtml(r.history);
  const amendmentRows = amendmentRowsHtml(r.amendments);
  // r.upcoming_hearings, not r.hearings — this page's own field name
  // (see db.get_bill_report(), which pre-filters to date >= today,
  // unlike /lookup's live d.hearings); hearingRowsHtml() itself doesn't
  // care what the array's called, only what's in it.
  const hearingRows = hearingRowsHtml(r.upcoming_hearings);
  const voteRows = voteRowsHtml(r.votes);

  reportEl.innerHTML = `
    <div class="card">
      <div class="bill-id">${r.state} ${r.bill_number}</div>
      <div class="status-line">
        ${statusBadgeHtml(r.status_label || 'In progress')}
        ${r.status_date ? `<span class="status-since">since ${fmtShortDate(r.status_date)}</span>` : ''}
      </div>
      <div class="bill-title">${r.title || ''}</div>
      ${r.description ? `<div class="bill-desc">${r.description}</div>` : ''}
      ${r.url ? `<a class="bill-link" href="${r.url}" target="_blank" rel="noopener">View on LegiScan →</a>` : ''}
      <div class="card-actions">
        ${r.flagged
          ? `<span class="status-badge">🚩 Flagged</span>
             <button type="button" class="secondary" onclick="draftLetter()">Draft letter</button>
             <button type="button" class="secondary" onclick="window.print()">Print</button>
             <button type="button" class="secondary" id="mute-btn" onclick="toggleMute()"
                     title="${r.digest_muted ? 'Start emailing me about this bill again' : "Stop emailing me about this bill — it stays flagged"}">
               ${r.digest_muted ? '\u{1F515} Muted in digest' : 'Mute in digest'}</button>
             <button type="button" class="danger" onclick="unflag()">Unflag</button>`
          : r.archived
            // Restoring is re-flagging (db.flag_bill), not the modal
            // openFlagModal() drives — the client(s) this was assigned
            // to are still attached, so there's nothing left to ask.
            ? `<span class="status-badge">🗄️ Archived</span>
               <button type="button" class="secondary" onclick="restore()">Restore</button>`
            : '<button id="flag-btn" class="secondary" onclick="openFlagModal()">Flag this bill</button>'}
      </div>
    </div>

    <div class="panel" style="margin-top:1rem">
      <div class="panel-head"><div class="title">Assigned client${(r.assigned_clients || []).length === 1 ? '' : 's'}</div></div>
      <div style="padding:1rem 1.15rem">
        ${r.flagged
          ? billClientCellHtml(r.bill_id, { showEffectiveDate: true })
          : '<p class="empty">Flag this bill to assign it to a client.</p>'}
      </div>
    </div>

    ${billLetters.length ? `
    <div class="panel" style="margin-top:1rem">
      <div class="panel-head"><div class="title">Letters on this bill</div></div>
      <div id="letters-list" style="padding:0.4rem 1.15rem 1rem">
        ${billLetters.map(l => `
          <div class="saved-row" style="padding-left:0;padding-right:0">
            <div class="saved-main">
              <a class="saved-name" href="/draft/letters/edit?id=${l.id}">${escapeNotes(l.subject)}</a>
              <div class="saved-meta">${l.client_name ? escapeNotes(l.client_name) + ' · ' : ''}Last edited ${escapeNotes((l.updated_at || '').slice(0, 10))}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>` : ''}

    ${r.flagged && (r.position_history || []).length ? `
    <div class="panel" style="margin-top:1rem">
      <div class="panel-head">
        <div>
          <div class="title">Position history</div>
          <div class="sub">Every change to a client's stance on this bill, newest first.</div>
        </div>
      </div>
      <div style="padding:0.4rem 1.15rem 1rem">${positionHistoryHtml(r.position_history)}</div>
    </div>` : ''}

    ${r.flagged ? `
    <div class="panel" style="margin-top:1rem">
      <div class="panel-head"><div class="title">Your notes</div></div>
      <div style="padding:1rem 1.15rem">
        <label for="bill-notes" class="sub" style="display:block;margin-bottom:0.35rem">Shared with your firm. Saves when you click away.</label>
        <textarea id="bill-notes" rows="4" style="width:100%" placeholder="What you're watching for on this bill, who you've talked to, what you told them…"
                  onblur="saveNotes(this)">${escapeNotes(r.notes || '')}</textarea>
        <div class="sub" id="notes-status" style="margin-top:0.35rem"></div>
      </div>
    </div>` : ''}

    ${currentStatusCardHtml(r.history, r.amend_by_date)}

    <div class="panel" style="margin-top:1rem">
      <div class="panel-head"><div class="title">Status history</div></div>
      ${historyRows
        ? `<div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Chamber</th><th>Action</th></tr></thead><tbody>${historyRows}</tbody></table></div>`
        : '<p class="empty" style="padding:1rem 1.15rem">No status history recorded yet.</p>'}
    </div>

    <div class="panel" style="margin-top:1rem">
      <div class="panel-head"><div class="title">Amendment history</div></div>
      ${amendmentRows
        ? `<div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Chamber</th><th>Amendment</th></tr></thead><tbody>${amendmentRows}</tbody></table></div>`
        : '<p class="empty" style="padding:1rem 1.15rem">No amendments recorded.</p>'}
    </div>

    <div class="panel" style="margin-top:1rem">
      <div class="panel-head"><div class="title">Upcoming hearings</div></div>
      ${hearingRows
        ? `<div style="overflow-x:auto"><table><thead><tr><th>When (PT)</th><th>Type</th><th>Details</th></tr></thead><tbody>${hearingRows}</tbody></table></div>`
        : '<p class="empty" style="padding:1rem 1.15rem">No upcoming hearings scheduled.</p>'}
    </div>

    <div class="panel" style="margin-top:1rem">
      <div class="panel-head"><div class="title">Votes</div></div>
      ${voteRows
        ? `<div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Chamber</th><th>Result</th></tr></thead><tbody>${voteRows}</tbody></table></div>`
        : '<p class="empty" style="padding:1rem 1.15rem">No votes recorded yet.</p>'}
    </div>
  `;
}

// Flagging used to be a single click straight to POST /api/flag, with
// client/position attached later (and separately) on /flagged via
// clientCell()/positionSelect(). This modal captures client + position
// as part of flagging itself, using the same picker (POSITIONS,
// clientOptionsHtml(), the quick-add panel) as /flagged's own
// dropdown, see CLIENT_QUICKADD_JS. Moved here from /lookup once
// search results stopped rendering full detail inline — see
// LOOKUP_BODY's own comment.
let flagModalClients = [];
// Tracks whether POST /api/flag has actually succeeded for the current
// modal session, so a retry after the client-link half fails doesn't
// re-POST /api/flag (harmless — db.flag_bill is idempotent — but
// pointless) and so Cancel after that point doesn't imply the flag
// itself needs redoing too.
let flagAlreadySaved = false;

function ensureFlagModal() {
  if (document.getElementById('flag-modal-backdrop')) return;
  const backdrop = document.createElement('div');
  backdrop.id = 'flag-modal-backdrop';
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="flag-modal-title">
      <div class="modal-head">
        <div>
          <div class="title" id="flag-modal-title">Flag this bill</div>
          <div class="sub" id="flag-modal-bill"></div>
        </div>
        <button type="button" class="icon-btn" id="flag-modal-close" aria-label="Close">×</button>
      </div>
      <form id="flag-modal-form">
        <label>
          <div class="sub" style="margin:0 0 0.3rem">Client</div>
          <select id="flag-client-select" required onchange="onFlagClientSelectChange(this)">
            <option value="">Choose a client…</option>
          </select>
        </label>
        <label>
          <div class="sub" style="margin:0 0 0.3rem">Position</div>
          <select id="flag-position-select"></select>
        </label>
        <div id="flag-modal-error" role="alert" aria-live="assertive"></div>
        <div class="modal-actions">
          <button type="submit" id="flag-modal-submit">Confirm Flagged Bill</button>
          <button type="button" class="secondary" id="flag-modal-cancel">Cancel</button>
        </div>
      </form>
    </div>
  `;
  document.body.appendChild(backdrop);
  document.getElementById('flag-position-select').innerHTML =
    POSITIONS.map(([value, label]) => `<option value="${value}" ${value === 'watch' ? 'selected' : ''}>${label}</option>`).join('');
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeFlagModal(); });
  document.getElementById('flag-modal-close').addEventListener('click', closeFlagModal);
  document.getElementById('flag-modal-cancel').addEventListener('click', closeFlagModal);
  document.getElementById('flag-modal-form').addEventListener('submit', confirmFlagBill);
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (backdrop.classList.contains('show')) closeFlagModal();
  });
}

function renderFlagClientSelect(selectedId) {
  const sel = document.getElementById('flag-client-select');
  sel.innerHTML = '<option value="">Choose a client…</option>' + clientOptionsHtml(flagModalClients);
  sel.value = selectedId != null ? String(selectedId) : '';
}

function onFlagClientSelectChange(selectEl) {
  if (selectEl.value !== ADD_NEW_CLIENT_VALUE) return;
  openQuickAddClient(flagModalClients, (updatedClients, created) => {
    flagModalClients = updatedClients;
    renderFlagClientSelect(created.id);
  }, () => {
    renderFlagClientSelect('');
  });
}

async function openFlagModal() {
  if (!currentReport) return;
  ensureFlagModal();
  flagAlreadySaved = false;
  document.getElementById('flag-modal-bill').textContent =
    `${currentReport.state} ${currentReport.bill_number}${currentReport.title ? ' — ' + currentReport.title : ''}`;
  document.getElementById('flag-modal-error').className = '';
  document.getElementById('flag-position-select').value = 'watch';
  const submitBtn = document.getElementById('flag-modal-submit');
  submitBtn.disabled = false;
  submitBtn.textContent = 'Confirm Flagged Bill';
  renderFlagClientSelect('');
  document.getElementById('flag-modal-backdrop').classList.add('show');

  // /report doesn't otherwise need the client list, so it's fetched
  // lazily here rather than on every page load like /flagged does.
  const sel = document.getElementById('flag-client-select');
  sel.disabled = true;
  try {
    const res = await fetch('/api/clients');
    if (res.status === 401) {
      window.location.href = `/login?next=${encodeURIComponent(window.location.pathname + window.location.search)}`;
      return;
    }
    flagModalClients = await res.json();
    renderFlagClientSelect('');
  } catch (err) {
    document.getElementById('flag-modal-error').textContent = 'Could not load your clients. Try again.';
    document.getElementById('flag-modal-error').className = 'show';
  } finally {
    sel.disabled = false;
  }
}

function closeFlagModal() {
  const backdrop = document.getElementById('flag-modal-backdrop');
  if (backdrop) backdrop.classList.remove('show');
}

async function confirmFlagBill(e) {
  e.preventDefault();
  if (!currentReport) return;
  const errorEl2 = document.getElementById('flag-modal-error');
  errorEl2.className = '';
  const clientId = document.getElementById('flag-client-select').value;
  if (!clientId || clientId === ADD_NEW_CLIENT_VALUE) {
    errorEl2.textContent = 'Choose a client (or add a new one) before confirming.';
    errorEl2.className = 'show';
    return;
  }
  const position = document.getElementById('flag-position-select').value;
  const submitBtn = document.getElementById('flag-modal-submit');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Saving…';

  try {
    if (!flagAlreadySaved) {
      const flagRes = await fetch('/api/flag', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bill_id: currentReport.bill_id }),
      });
      if (flagRes.status === 401) {
        // Same convention as the server-side redirects in _redirect_to_login()
        // (see app.py) — carry the report you were looking at through the
        // login wall via ?next=..., so signing in lands you back on it
        // instead of a dead end.
        window.location.href = `/login?next=${encodeURIComponent(window.location.pathname + window.location.search)}`;
        return;
      }
      const flagData = await flagRes.json();
      if (!flagRes.ok) throw new Error(flagData.error || 'Could not flag this bill');
      flagAlreadySaved = true;
    }

    const linkRes = await fetch('/api/bill-clients', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bill_id: currentReport.bill_id, client_id: Number(clientId), position }),
    });
    if (!linkRes.ok) {
      const linkData = await linkRes.json();
      throw new Error(linkData.error || 'Bill was flagged, but assigning the client failed.');
    }
    closeFlagModal();
    // Re-fetch so the card/assigned-client panel reflect the new
    // flagged (and now assigned) state instead of staying stale until
    // the next page load.
    load();
  } catch (err) {
    // Don't let a failure here read as "nothing happened" when the
    // flag half already went through — say so explicitly, and leave
    // the modal open so Confirm can be clicked again (it only re-tries
    // the client-link call at that point, see flagAlreadySaved above)
    // instead of silently leaving a flagged-but-unassigned bill.
    errorEl2.textContent = flagAlreadySaved
      ? `${err.message} The bill is flagged — try again, or finish this later from your Flagged Bills list.`
      : err.message;
    errorEl2.className = 'show';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Confirm Flagged Bill';
  }
}

load();
</script>
