<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — Rotunda</title>
<link rel="stylesheet" href="{{STYLE_HREF}}">
{{FONT_LINKS}}
{{THEME_INIT_SCRIPT}}
</head>
<body>
{{top_nav}}
<main>
<div class="wrap">
  <h1>Create your account</h1>
  <div class="step-indicator">
    <span class="step-dot filled"></span><span class="step-dot"></span>
    <span class="sub">Step 1 of 2 — after this, you'll fill in your CAL-ACCESS-style registration details.</span>
  </div>

  <div class="card">
    <p class="sub req-legend"><span class="req" aria-hidden="true">*</span> Both fields are required.</p>
    <form id="f" style="margin:0">
      <label style="flex:1 1 100%">
        <div class="field-label">Email <span class="req" aria-hidden="true">*</span></div>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required style="width:100%">
      </label>
      <label style="flex:1 1 100%">
        <div class="field-label">Password <span class="req" aria-hidden="true">*</span></div>
        <div style="display:flex;gap:0.5rem">
          <input id="password" type="password" autocomplete="new-password" required minlength="8" style="width:100%">
          <button type="button" id="toggle-password" class="secondary" aria-pressed="false" aria-label="Show password" style="flex:none">Show</button>
        </div>
        <div class="sub" id="password-hint" style="margin:0.3rem 0 0;font-size:0.78rem">8+ characters</div>
      </label>
      <button type="submit">Continue →</button>
    </form>
  </div>

  <div id="loading" role="status"><span class="spinner"></span>Creating account…</div>
  <div id="error" role="alert" aria-live="assertive"></div>
</div>
</main>

<script>
const togglePasswordBtn = document.getElementById('toggle-password');
const passwordInput = document.getElementById('password');
togglePasswordBtn.addEventListener('click', () => {
  const show = passwordInput.type === 'password';
  passwordInput.type = show ? 'text' : 'password';
  togglePasswordBtn.textContent = show ? 'Hide' : 'Show';
  // The visible word stays one word; the accessible name says what it
  // is a word about. Out of context "Show, toggle button" is a button
  // that shows something unspecified.
  togglePasswordBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  togglePasswordBtn.setAttribute('aria-pressed', show ? 'true' : 'false');
});
/* U5: the hint resolves as you type.
 *
 * "8+ characters" was static text, and the only enforcement was
 * minlength plus a server round trip — so the one flow every user
 * completes exactly once could end in a rejected submit for a rule
 * that was on screen the whole time. The message stays word-for-word
 * what the server says; only its state changes.
 *
 * aria-live is deliberately absent: the hint is already the input's
 * description, and announcing on every keystroke would talk over the
 * typing. A screen-reader user hears it on focus, and hears the
 * server's identical sentence if they submit early anyway.
 */
const passwordHint = document.getElementById('password-hint');
const MIN_PASSWORD = 8;
passwordInput.setAttribute('aria-describedby', 'password-hint');
passwordInput.addEventListener('input', () => {
  const len = passwordInput.value.length;
  if (!len) {
    passwordHint.className = 'sub';
    passwordHint.textContent = '8+ characters';
    return;
  }
  const ok = len >= MIN_PASSWORD;
  passwordHint.className = ok ? 'sub hint-met' : 'sub hint-unmet';
  passwordHint.textContent = ok
    ? '✓ 8+ characters'
    : `${MIN_PASSWORD - len} more character${MIN_PASSWORD - len === 1 ? '' : 's'} to go`;
});

const form = document.getElementById('f');
const errorEl = document.getElementById('error');
const loadingEl = document.getElementById('loading');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  errorEl.className = ''; loadingEl.className = 'show';
  form.querySelector('button').disabled = true;

  try {
    const res = await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not create account');
    window.location.href = '/signup/profile';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
    loadingEl.className = '';
    form.querySelector('button').disabled = false;
  }
});
</script>
</body>
</html>
