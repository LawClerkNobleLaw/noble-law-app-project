<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — Rotunda</title>
<link rel="stylesheet" href="{{STYLE_HREF}}">
{{FONT_LINKS}}
{{THEME_INIT_SCRIPT}}
</head>
<body>
{{top_nav}}
<main>
<div class="wrap auth-wrap">
  <span class="brand-mark auth-mark" style="width:44px;height:44px" aria-hidden="true"></span>
  <h1>Create your account</h1>
  <div class="step-indicator">
    <span class="step-dot filled"></span><span class="step-dot"></span>
    <span class="sub">First, your login — then a short setup to get you under the dome.</span>
  </div>

  <div class="card auth-card">
    <p class="sub req-legend"><span class="req" aria-hidden="true">*</span> Both fields are required.</p>
    <form id="f" style="margin:0">
      <label style="flex:1 1 100%">
        <div class="field-label">Email <span class="req" aria-hidden="true">*</span></div>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required style="width:100%">
      </label>
      <label style="flex:1 1 100%">
        <div class="field-label">Password <span class="req" aria-hidden="true">*</span></div>
        <div style="display:flex;gap:0.5rem">
          <input id="password" type="password" autocomplete="new-password" required minlength="8" style="width:100%">
          <button type="button" id="toggle-password" class="secondary" aria-pressed="false" aria-label="Show password" style="flex:none">Show</button>
        </div>
        <div class="sub" id="password-hint" style="margin:0.3rem 0 0;font-size:0.78rem">8+ characters, with an uppercase letter, a lowercase letter, a number, and a special character</div>
      </label>
      <button type="submit" class="auth-submit">Continue →</button>
    </form>
  </div>

  <div id="loading" role="status"><span class="spinner"></span>Creating account…</div>
  <div id="error" role="alert" aria-live="assertive"></div>

  <p class="auth-alt">Already have an account? <a href="/login">Sign in</a></p>
</div>
</main>

<script>
const togglePasswordBtn = document.getElementById('toggle-password');
const passwordInput = document.getElementById('password');
togglePasswordBtn.addEventListener('click', () => {
  const show = passwordInput.type === 'password';
  passwordInput.type = show ? 'text' : 'password';
  togglePasswordBtn.textContent = show ? 'Hide' : 'Show';
  // The visible word stays one word; the accessible name says what it
  // is a word about. Out of context "Show, toggle button" is a button
  // that shows something unspecified.
  togglePasswordBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  togglePasswordBtn.setAttribute('aria-pressed', show ? 'true' : 'false');
});
/* U5: the hint resolves as you type.
 *
 * The rule is the "8-4 rule": 8+ characters and all four character
 * classes. The only server-side enforcement is accounts.password_problem
 * plus a round trip, so — as with the old length-only hint — the one flow
 * every user completes exactly once could otherwise end in a rejected
 * submit for a rule that was on screen the whole time. Each requirement is
 * checked live and the still-missing ones are named; the server rejects
 * with the same rule (accounts.PASSWORD_RULE) if a user submits early.
 *
 * aria-live is deliberately absent: the hint is already the input's
 * description, and announcing on every keystroke would talk over the
 * typing. A screen-reader user hears it on focus, and hears the
 * server's identical sentence if they submit early anyway.
 */
const passwordHint = document.getElementById('password-hint');
const PASSWORD_CHECKS = [
  [v => v.length >= 8, '8+ characters'],
  [v => /[A-Z]/.test(v), 'an uppercase letter'],
  [v => /[a-z]/.test(v), 'a lowercase letter'],
  [v => /[0-9]/.test(v), 'a number'],
  [v => /[^A-Za-z0-9]/.test(v), 'a special character'],
];
passwordInput.setAttribute('aria-describedby', 'password-hint');
passwordInput.addEventListener('input', () => {
  const v = passwordInput.value;
  if (!v) {
    passwordHint.className = 'sub';
    passwordHint.textContent = '8+ characters, with an uppercase letter, a lowercase letter, a number, and a special character';
    return;
  }
  const missing = PASSWORD_CHECKS.filter(([test]) => !test(v)).map(([, label]) => label);
  passwordHint.className = missing.length ? 'sub hint-unmet' : 'sub hint-met';
  passwordHint.textContent = missing.length
    ? `Still needs: ${missing.join(', ')}`
    : '✓ Meets all requirements';
});

const form = document.getElementById('f');
const errorEl = document.getElementById('error');
const loadingEl = document.getElementById('loading');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  errorEl.className = ''; loadingEl.className = 'show';
  form.querySelector('button').disabled = true;

  try {
    const res = await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not create account');
    window.location.href = '/onboarding';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
    loadingEl.className = '';
    form.querySelector('button').disabled = false;
  }
});
</script>
</body>
</html>
