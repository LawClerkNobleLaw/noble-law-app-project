<div class="page-head"><div><a href="/draft/letters" class="sub">← Letters</a></div></div>
<div id="error" role="alert" aria-live="assertive"></div>
<div id="loading" class="show"><span class="spinner"></span>Loading…</div>
<div id="letter" hidden>
  <div class="card">
    <div class="bill-id" id="context"></div>
    <label for="letter-subject" class="sub" style="display:block;margin:0.6rem 0 0.2rem">Subject line</label>
    <input id="letter-subject" style="width:100%" onblur="save()">
    <div class="card-actions">
      <button type="button" class="secondary" onclick="window.print()">Print</button>
      <button type="button" class="secondary" onclick="copyLetter()">Copy text</button>
      <span class="sub" id="save-status" aria-live="polite"></span>
    </div>
  </div>

  <!-- Who this goes to (US-I2). Above the letter rather than beside it:
       the recipient is decided before the argument is written, and a
       panel below the 26-row textarea would be found after the letter
       was finished. -->
  <div class="panel" id="routing-panel" hidden style="margin-top:1rem">
    <div class="panel-head">
      <div>
        <div class="title">Who handles this</div>
        <div class="sub" id="routing-sub"></div>
      </div>
    </div>
    <div id="routing-list" style="padding:0.4rem 1.15rem 1rem"></div>
  </div>

  <div class="panel" style="margin-top:1rem">
    <div class="panel-head">
      <div>
        <div class="title">Letter</div>
        <div class="sub">Saves when you click away. Rotunda never sends this — print it or copy it out.</div>
      </div>
    </div>
    <div style="padding:1rem 1.15rem">
      <label for="letter-body" class="sr-only">Letter text</label>
      <textarea id="letter-body" rows="26" class="letter-body" onblur="save()"></textarea>
    </div>
  </div>
</div>

<script>
const errorEl = document.getElementById('error');
const letterId = new URLSearchParams(window.location.search).get('id');
const subjectEl = document.getElementById('letter-subject');
const bodyEl = document.getElementById('letter-body');
const statusEl = document.getElementById('save-status');
let current = null;

async function load() {
  if (!letterId) {
    errorEl.textContent = 'Missing id in the URL.';
    errorEl.className = 'show';
    document.getElementById('loading').className = '';
    return;
  }
  try {
    const res = await fetch(`/api/letters/one?id=${letterId}`);
    if (res.status === 401) { window.location.href = '/login'; return; }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not load that letter');
    current = data;
    subjectEl.value = data.subject || '';
    bodyEl.value = data.body || '';
    // The bill and client this was written about, as they read when it
    // was written (see the letters table in schema.sql) — context, not a
    // live link to something that may have moved since.
    const bits = [data.bill_label, data.client_name].filter(Boolean);
    document.getElementById('context').textContent = bits.join(' · ') || 'No bill attached';
    document.getElementById('letter').hidden = false;
    loadRouting();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  } finally {
    document.getElementById('loading').className = '';
  }
}

/* ── Who handles this (US-I2) ──────────────────────────────────────
 *
 * Suggestions, never an action. The panel offers names and the copy
 * buttons put one on the clipboard; it does not address the letter, and
 * nothing here writes to it. Same boundary the rest of drafting keeps
 * (see letter_drafts.py): the app never sends, so who a letter is
 * addressed to stays something the user decides and types.
 *
 * Loaded after the letter rather than with it, so a firm with no
 * directory — or a slow lookup across a few hundred offices — never
 * delays the thing the page is actually for.
 */
async function loadRouting() {
  const panel = document.getElementById('routing-panel');
  try {
    const res = await fetch(`/api/letters/routing?id=${letterId}`);
    if (!res.ok) return;
    const data = await res.json();
    if (!data.have_directory) {
      // Worth saying rather than staying blank: this is the one place
      // where the value of importing a directory is obvious.
      panel.hidden = false;
      document.getElementById('routing-sub').textContent = '';
      document.getElementById('routing-list').innerHTML =
        `<p class="sub" style="margin:0">No Capitol directory imported yet.
         <a href="/directory">Import your staff sheet</a> and this will suggest
         who in each office handles the committee this bill is in front of.</p>`;
      return;
    }
    renderRouting(data);
  } catch (err) {
    // A failed suggestion lookup is not a failed page. The letter is
    // the point; this panel just stays hidden.
  }
}

function renderRouting(data) {
  const panel = document.getElementById('routing-panel');
  const list = document.getElementById('routing-list');
  const sub = document.getElementById('routing-sub');
  panel.hidden = false;

  const committee = [data.chamber, data.committee].filter(Boolean).join(' ');
  if (!data.suggestions.length) {
    sub.textContent = committee ? `Last heard in ${committee}.` : '';
    list.innerHTML = `<p class="sub" style="margin:0">${committee
      ? `Nobody in your directory is listed as handling ${escapeText(committee)}.`
      : `This bill has no committee hearing on record, so there's nothing to match against yet.`}</p>`;
    return;
  }
  sub.textContent = committee
    ? `Matched against ${committee}, the committee this bill was last before.`
    : 'Matched against the bill\u2019s author.';

  list.innerHTML = data.suggestions.map(s => {
    const person = s.staff, office = s.legislator;
    const contact = [person.email, person.phone].filter(Boolean);
    return `
    <div class="routing-row">
      <div>
        <strong>${escapeText(person.full_name)}</strong>
        ${person.title ? `<span class="sub"> — ${escapeText(person.title)}</span>` : ''}
        ${person.is_stale ? '<span class="cite cite-repeal">flagged stale</span>' : ''}
        <div class="sub">${escapeText(office.full_name)}${
          office.chamber ? ` · ${escapeText(office.chamber)}` : ''} — ${escapeText(s.reason)}</div>
        ${contact.length ? `<div class="sub">${contact.map(escapeText).join(' · ')}</div>` : ''}
      </div>
      <div class="routing-actions">
        ${person.email ? `<button type="button" class="secondary"
           onclick="copyValue('${escapeAttr(person.email)}', 'Email address copied.')">Copy email</button>` : ''}
        <button type="button" class="secondary"
          onclick="copyValue('${escapeAttr(addressLine(person, office))}', 'Address block copied.')">Copy address</button>
      </div>
    </div>`;
  }).join('');
}

// What goes at the top of a letter, assembled from what the directory
// holds. Copied rather than inserted — see the panel's note above.
function addressLine(person, office) {
  return [person.full_name, person.title,
          `Office of ${office.full_name}`,
          office.office_room ? `Room ${office.office_room}, State Capitol` : '',
          'Sacramento, CA 95814'].filter(Boolean).join('\n');
}

async function copyValue(text, message) {
  const value = text.replace(/\\n/g, '\n');
  try {
    await navigator.clipboard.writeText(value);
    statusEl.textContent = message;
  } catch (err) {
    // Same fallback as copyLetter() below, and for the same reasons.
    window.prompt('Copy this:', value);
  }
}

function escapeText(text) {
  return String(text == null ? '' : text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// For a value going inside a single-quoted inline handler, where the
// quote and the backslash both have to survive as data.
function escapeAttr(text) {
  return escapeText(text).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n');
}

// Saves on blur rather than per keystroke — same shape as the bill
// report's notes field, and a letter is written in one sitting. The
// status line says so instead of leaving the user guessing.
async function save() {
  if (!current) return;
  if (subjectEl.value === current.subject && bodyEl.value === current.body) return;
  errorEl.className = '';
  statusEl.textContent = 'Saving…';
  try {
    const res = await fetch('/api/letters/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: Number(letterId), subject: subjectEl.value, body: bodyEl.value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not save that letter');
    current = data;
    statusEl.textContent = 'Saved.';
  } catch (err) {
    statusEl.textContent = '';
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  }
}

// A letter's destination is an email or a letterhead in some other
// application, so the useful export is the text itself. Falls back to
// selecting it when the clipboard API isn't available (an insecure
// origin, an older browser) rather than silently doing nothing.
async function copyLetter() {
  try {
    await navigator.clipboard.writeText(bodyEl.value);
    statusEl.textContent = 'Copied.';
  } catch (err) {
    bodyEl.focus();
    bodyEl.select();
    statusEl.textContent = 'Selected — press ⌘C to copy.';
  }
}

load();
</script>
