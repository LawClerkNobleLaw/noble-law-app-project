
<div class="page-head"><div><a href="/lobbying" class="sub">← Organization Search</a></div></div>
<div id="error" role="alert" aria-live="assertive"></div>
<div id="loading" role="status" class="skeleton show"><span class="sr-only">Loading…</span>{{skeleton_panels}}</div>
<div id="detail"></div>

<script>
const errorEl = document.getElementById('error');
const detailEl = document.getElementById('detail');
const params = new URLSearchParams(window.location.search);

function money(n) {
  return typeof n === 'number' ? '$' + n.toLocaleString(undefined, {maximumFractionDigits: 0}) : '';
}

// Both branches return markup, so the name is escaped either way —
// these are firm and client names straight out of CAL-ACCESS filings,
// where an ampersand is the norm rather than the exception.
function highlight(text, name) {
  const safe = escapeText(text || '');
  return (text || '').toLowerCase() === (name || '').toLowerCase() ? `<strong>${safe}</strong>` : safe;
}

// raw_bill_text is real free text from CAL-ACCESS ingestion, not a
// clean bill list — it mixes real bill numbers with prose ("SB 53;
// Legislature, Governor's Office Re: ...") and sometimes has no bill
// number at all ("See Attachment A"). So this doesn't split-and-
// replace the whole string; it finds actual bill-number substrings
// (a chamber prefix + number, with "SB 53, 420" style comma lists
// expanded to one pill per number) and turns just those into links,
// leaving every other word of the original text exactly as it was —
// nothing here is parsed further or thrown away.
function billPills(text) {
  if (!text) return '';
  const re = /\b(AB|SB|ACA|SCA|AJR|SJR|ACR|SCR|HR|SR)\s?(\d+(?:\s*,\s*\d+)*)\b/gi;
  // Escaped BEFORE the pills go in, not after: everything this returns
  // that isn't a link is the filing's own prose, and it is the least
  // sanitised string in the app — free text typed into a CAL-ACCESS
  // form. A bill number can't contain any of the escaped characters,
  // so the pattern still finds every one of them afterwards.
  return escapeText(text).replace(re, (whole, prefix, nums) => nums.split(',').map(n => {
    const bill = `${prefix.toUpperCase()} ${n.trim()}`;
    return `<a class="tag" href="/lookup?bill=${encodeURIComponent(bill)}">${bill}</a>`;
  }).join(' '));
}

function relationshipRows(rows, selectedName) {
  if (!rows.length) return '<div class="panel" style="padding:1rem 1.15rem"><p class="empty">No lobbying relationships found for this name.</p></div>';
  return `
    <div class="panel">
      <div class="panel-head"><h2 class="title">Lobbying relationships</h2></div>
      <div style="overflow-x:auto">
      <table>
        <thead><tr><th scope="col">Firm</th><th scope="col">Client / employer</th><th scope="col">Form</th><th scope="col">Period</th><th scope="col">Amount</th><th scope="col">Bill / activity</th></tr></thead>
        <tbody>
        ${rows.map(r => `
          <tr>
            <td>${highlight(r.firm, selectedName)}</td>
            <td>${highlight(r.client, selectedName)}</td>
            <td><span class="tag" title="Firm/client direction is inferred from this form type">${escapeText(r.form_type || '—')}</span></td>
            <td class="date">${escapeText((r.period_start || '').split(' ')[0])} – ${escapeText((r.period_end || '').split(' ')[0])}</td>
            <td>${money(r.amount_spent)}</td>
            <td>${billPills(r.raw_bill_text)}</td>
          </tr>
        `).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;
}

function addClientUrl(d) {
  const p = new URLSearchParams({prefill_name: d.name});
  if (d.entity && d.entity.id) p.set('prefill_entity_id', d.entity.id);
  return `/clients?${p.toString()}`;
}

function renderDetail(d) {
  const e = d.entity;
  document.title = `${d.name} — Rotunda`;
  detailEl.innerHTML = `
    <div class="card">
      <h1 class="bill-title">${escapeText(d.name)}</h1>
      ${e ? `
        <div style="margin-top:0.3rem">
          <span class="tag">${escapeText(e.entity_type || '')}</span>
          ${e.registration_status ? `<span class="tag">${escapeText(e.registration_status)}</span>` : ''}
          ${e.source_form ? `<span class="tag">Form ${escapeText(e.source_form)}</span>` : ''}
        </div>
        <div class="bill-desc" style="margin-top:0.5rem">${escapeText([e.address, e.city, e.state, e.zip].filter(Boolean).join(', '))}</div>
      ` : '<div class="bill-desc" style="margin-top:0.3rem">Named as a client in a disclosure — no independent registration on file.</div>'}
      <div class="card-actions">
        <a class="secondary" href="${addClientUrl(d)}">+ Add as client</a>
      </div>
    </div>
    <div style="margin-top:1rem">${relationshipRows(d.relationships, d.name)}</div>
  `;
}

async function load() {
  try {
    const p = params.get('id') ? `id=${encodeURIComponent(params.get('id'))}` : `name=${encodeURIComponent(params.get('name') || '')}`;
    const res = await fetch(`/api/lobbying/detail?${p}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not load detail');
    renderDetail(data);
  } catch (err) {
    detailEl.innerHTML = '';
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  } finally {
    document.getElementById('loading').className = '';
  }
}

load();
</script>
