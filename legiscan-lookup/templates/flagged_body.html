
<div class="page-head">
  <div>
    <h1>Flagged Bills</h1>
    <p class="sub">Bills you're tracking. Rechecked every morning.</p>
  </div>
  <div style="display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap">
    <a href="/flagged/calendar" class="secondary">Hearing calendar →</a>
    <a href="/flagged/sponsors" class="secondary">Sponsors &amp; votes →</a>
  </div>

<div id="error" role="alert" aria-live="assertive"></div>
<div class="stat-grid" id="stats"></div>
<div id="rail"></div>

<div class="panel">
  <div class="panel-head">
    <div>
      <div class="title">Flagged Bills</div>
      <div class="sub" id="freshness"></div>
    </div>
    <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap">
      <div class="search-box">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="5" cy="5" r="3.5"/><path d="M8 8l2 2" stroke-linecap="round"/></svg>
        <label for="flagged-search" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Filter your flagged bills</label>
        <input id="flagged-search" type="text" placeholder="Filter your flagged bills...">

        <input type="checkbox" id="group-by-client">
        Group by client
      </label>
      <button type="button" class="secondary" id="export-csv" onclick="exportCsv()"
              title="Download the rows below, exactly as filtered, as a spreadsheet">Export CSV</button>
    </div>
  </div>
  <div id="loading" class="show" style="padding:1rem 1.15rem"><span class="spinner"></span>Loading…</div>
  <div id="list"></div>
</div>

<script src="{{HEARING_TIME_SRC}}"></script>
<script src="{{BILL_STATUS_SRC}}"></script>
<script src="{{TOAST_SRC}}"></script>
<script src="{{POSITION_HISTORY_SRC}}"></script>
<script src="{{CLIENT_QUICKADD_SRC}}"></script>
<script src="{{CONFIRM_DELETE_SRC}}"></script>
<script src="{{TITLE_CASE_SRC}}"></script>
<script src="{{ROW_MENU_SRC}}"></script>
<script src="{{BILL_CLIENTS_SRC}}"></script>
<script>
const listEl = document.getElementById('list');
const loadingEl = document.getElementById('loading');
const errorEl = document.getElementById('error');
const tabsEl = document.getElementById('tabs');
const statsEl = document.getElementById('stats');
const searchEl = document.getElementById('flagged-search');
const sortSelectEl = document.getElementById('sort-by');
const railEl = document.getElementById('rail');
const groupEl = document.getElementById('group-by-client');
let allClients = [];
let currentRows = [];

/* ── Composable filters (P2-24) ────────────────────────────────────────
 *
 * The list used to offer one text box, four sorts, and five mutually
 * exclusive tabs (All / Hearing this week / Support / Oppose / Watch).
 * That answers neither of the two questions this firm actually asks it:
 * "everything for UCSA before Thursday's call" needs a client filter,
 * and "every bill where any client is Oppose" needs the client and
 * position dimensions to compose rather than replace each other.
 *
 * So: four independent multi-select dimensions, faceted counts, the
 * whole state in the URL, and the same rail component the search page
 * already uses (see .search-filters in style.css). Filtering stays
 * entirely client-side — GET /api/flagged already returns every row.
 *
 * Client and position compose ON THE SAME ASSIGNMENT, which is the one
 * place this differs from the search page's independent groups. "UCSA"
 * + "Oppose" means bills UCSA opposes, not bills where UCSA is a client
 * and somebody happens to oppose. Getting that wrong would answer a
 * plausible question with a wrong list, which is worse than answering
 * neither.
 */
const UNASSIGNED = '__none__';

const URGENCY_BUCKETS = [
  ['overdue', 'Today or overdue', d => d !== null && d <= 0],
  ['week', 'Within 7 days', d => d !== null && d > 0 && d <= 7],
  ['fortnight', '8–14 days', d => d !== null && d > 7 && d <= 14],
  ['later', 'More than 2 weeks', d => d !== null && d > 14],
  [UNASSIGNED, 'Nothing scheduled', d => d === null],
];

let filters = {
  client: new Set(), position: new Set(), urgency: new Set(), committee: new Set(),
};
let groupByClient = false;
let savedViews = [];

// A pure front-end re-sort of whatever GET /api/flagged already
// returned (currentRows) — no extra API call/param, since the whole
// list is already in memory for filtering/search anyway. currentRows
// itself stays in the server's own order (db.list_flagged_bills's
// ORDER BY b.bill_number), which is exactly what the 'bill_number'
// option wants, so that one's a no-op instead of re-implementing
// SQLite's own string ordering here. Persisted across reloads —
// same localStorage pattern THEME_INIT_SCRIPT uses for the dark-mode
// toggle, just scoped to this page's own key.
// Defaults to next_action: urgency is the ordering a list of tracked
// bills is actually read in, and alphabetical-by-anything buries the one
// with a hearing on Monday. Only ever written on an explicit change, so
// a user who has picked a sort before keeps theirs and only people who
// never touched it move to the new default.
const SORT_STORAGE_KEY = 'flaggedBills.sortBy';
let sortBy = localStorage.getItem(SORT_STORAGE_KEY) || 'next_action';
if (sortSelectEl) sortSelectEl.value = sortBy;

// The client chips / position selects / add-client picker are shared
// with the bill report (see bill_clients.js); this page supplies where
// its own copy of that state lives.
initBillClients({
  allClients: () => allClients,
  assignedClients: (billId) => {
    const row = currentRows.find(r => r.bill_id === billId);
    return row ? (row.assigned_clients || []) : [];
  },
  onError: (message) => {
    errorEl.textContent = message || '';
    errorEl.className = message ? 'show' : '';
  },
  onChanged: (updatedClients) => {
    if (updatedClients) allClients = updatedClients;
    load();
  },
  billLabel: (billId) => {
    const row = currentRows.find(r => r.bill_id === billId);
    return row ? `${row.state} ${row.bill_number}` : '';
  },
});

// Same three-character escape the other pages carry (profile, lookup,
// letters). Client names and committee names both reach the rail as
// text from the database now, so this page needs it too.
function escapeText(text) {
  return String(text == null ? '' : text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function firstClientName(r) {
  const names = (r.assigned_clients || []).map(c => c.name).sort((a, b) => a.localeCompare(b));
  return names[0] || '';
}

// days_until comes precomputed from the server (see
// db._next_hearings_for_bills) so the countdown is measured from
// California's date, not the browser's. null means nothing scheduled.
function daysUntilNext(r) {
  if (r.next_hearing) return r.next_hearing.days_until;
  // Same fallback the Next action cell prints: a bill with no scheduled
  // hearing but a deadline the user set themselves still has a date to
  // be late for, and sorting it in with the rest is the whole point of
  // having entered it.
  if (r.amend_by_days_until !== null && r.amend_by_days_until !== undefined) return r.amend_by_days_until;
  return null;
}

function sortRows(rows) {
  if (sortBy === 'next_action') {
    // Soonest deadline first; bills with nothing scheduled fall to the
    // end (they're the ones with no action to be late for), ordered by
    // bill number among themselves so the tail isn't arbitrary.
    return rows.slice().sort((a, b) => {
      const ad = daysUntilNext(a), bd = daysUntilNext(b);
      if (ad === null && bd === null) return (a.bill_number || '').localeCompare(b.bill_number || '');
      if (ad === null) return 1;
      if (bd === null) return -1;
      return ad - bd;
    });
  }
  if (sortBy === 'title') {
    return rows.slice().sort((a, b) => (a.title || '').localeCompare(b.title || ''));
  }
  if (sortBy === 'client') {
    // Unassigned bills (no client name to sort by) fall to the end
    // rather than sorting first the way an empty string normally would.
    return rows.slice().sort((a, b) => {
      const an = firstClientName(a), bn = firstClientName(b);
      if (!an && bn) return 1;
      if (an && !bn) return -1;
      return an.localeCompare(bn);
    });
  }
  if (sortBy === 'activity') {
    // latest_activity_date is the newest bill_status_history date for
    // that bill (see db.list_flagged_bills) — newest first, and bills
    // with no recorded history yet sort to the end rather than first.
    return rows.slice().sort((a, b) => {
      const ad = a.latest_activity_date || '', bd = b.latest_activity_date || '';
      if (!ad && bd) return 1;
      if (ad && !bd) return -1;
      return bd.localeCompare(ad);
    });
  }
  return rows;
}

if (sortSelectEl) {
  sortSelectEl.addEventListener('change', () => {
    sortBy = sortSelectEl.value;
    localStorage.setItem(SORT_STORAGE_KEY, sortBy);
    applyFilters();
  });
}

const ICON_FLAG = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 1v12M2 2h8l-2 2.5L10 7H2" stroke-linejoin="round"/></svg>';
const ICON_ALERT = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5.5"/><path d="M7 4.5v3" stroke-linecap="round"/><circle cx="7" cy="9.8" r="0.6" fill="currentColor" stroke="none"/></svg>';

/* Two tiles, not four. Active clients and Disclosures moved to the
   dashboard (see DASHBOARD_BODY), which is where numbers about the whole
   account belong now that there is such a page — on this one they
   described things the table underneath doesn't contain, and the four of
   them said the same four things the dashboard says one click away.
   These two survive because they're both counts *of the rows below*:
   how many there are, and how many still need work. */
function renderStats() {
  if (!currentRows.length) { statsEl.innerHTML = ''; return; }
  const unassigned = currentRows.filter(r => !(r.assigned_clients || []).length).length;
  statsEl.innerHTML = `
    <div class="stat-card">
      <div class="stat-icon">${ICON_FLAG}</div>
      <div class="stat-label">Flagged bills</div>
      <div class="stat-value">${currentRows.length}</div>
      <div class="stat-foot">Refreshed once a day</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">${ICON_ALERT}</div>
      <div class="stat-label">Needs a client</div>
      <div class="stat-value">${unassigned}</div>
      <div class="stat-foot">Flagged bills with no client assigned</div>
    </div>
  `;
}

/* ── The four dimensions ───────────────────────────────────────────────
 *
 * Each one reads values off a row. client and position are multi-valued
 * (a bill can carry three clients at three positions); urgency and
 * committee are single-valued.
 *
 * Committee comes out of the next hearing's description, which LegiScan
 * writes as "<Chamber> <Committee> Hearing" — "Senate Judiciary
 * Hearing", "Assembly Privacy And Consumer Protection Hearing". A row
 * whose description doesn't fit that shape offers no committee rather
 * than a guessed one, same house rule the search filters follow. Note
 * the scope: this is the committee of the NEXT hearing, not every
 * committee a bill has ever been in front of — that's the actionable
 * one ("what's in Approps this week") and the only one on the row.
 */
function committeeOf(r) {
  const description = (r.next_hearing && r.next_hearing.description) || '';
  const match = /^(Senate|Assembly)\s+(.+?)\s+Hearing$/i.exec(description.trim());
  return match ? `${match[1]} ${match[2]}` : null;
}

function urgencyOf(r) {
  const days = daysUntilNext(r);
  const bucket = URGENCY_BUCKETS.find(([, , test]) => test(days));
  return bucket ? bucket[0] : UNASSIGNED;
}

// One synthetic assignment for a bill nobody has assigned yet, so
// "No client" is a value in both the client and position dimensions
// rather than a special case threaded through every predicate.
function assignmentsOf(r) {
  const assigned = r.assigned_clients || [];
  if (!assigned.length) return [{ key: UNASSIGNED, position: UNASSIGNED }];
  return assigned.map(c => ({ key: String(c.id), position: c.position || 'watch' }));
}

const DIMENSIONS = [
  { key: 'client', label: 'Client' },
  { key: 'position', label: 'Position' },
  { key: 'urgency', label: 'Next action' },
  { key: 'committee', label: 'Committee' },
];

function clientName(key) {
  if (key === UNASSIGNED) return 'No client';
  const client = allClients.find(c => String(c.id) === String(key));
  return client ? client.name : `Client ${key}`;
}

function valueLabel(dimension, value) {
  if (dimension === 'client') return clientName(value);
  // positionLabel() is the shared support/oppose/watch vocabulary
  // (position_history.js); only the absence of a client is this page's.
  if (dimension === 'position') return value === UNASSIGNED ? 'No client' : positionLabel(value);
  if (dimension === 'urgency') {
    const bucket = URGENCY_BUCKETS.find(([v]) => v === value);
    return bucket ? bucket[1] : value;
  }
  return value;
}

/* ── Does a row pass? ──────────────────────────────────────────────────
 *
 * exceptDimension is how the faceted counts are built: a group's own
 * selection is left out of its own counts, so "Oppose 12" keeps saying
 * 12 after you click it. Counting the already-filtered list instead
 * would make every unpicked option read 0 as soon as one is picked.
 */
function rowPasses(r, exceptDimension) {
  const clientPicked = exceptDimension === 'client' ? new Set() : filters.client;
  const positionPicked = exceptDimension === 'position' ? new Set() : filters.position;
  if (clientPicked.size || positionPicked.size) {
    // The pairing rule: one assignment has to satisfy both.
    const ok = assignmentsOf(r).some(a =>
      (!clientPicked.size || clientPicked.has(a.key)) &&
      (!positionPicked.size || positionPicked.has(a.position)));
    if (!ok) return false;
  }
  if (exceptDimension !== 'urgency' && filters.urgency.size && !filters.urgency.has(urgencyOf(r))) {
    return false;
  }
  if (exceptDimension !== 'committee' && filters.committee.size) {
    const committee = committeeOf(r);
    if (!committee || !filters.committee.has(committee)) return false;
  }
  return true;
}

function matchesSearch(r, q) {
  if (!q) return true;
  return `${r.bill_number || ''} ${r.title || ''}`.toLowerCase().includes(q);
}

function searchQuery() {
  return (searchEl ? searchEl.value : '').trim().toLowerCase();
}

function visibleRows() {
  const q = searchQuery();
  return sortRows(currentRows.filter(r => rowPasses(r, null) && matchesSearch(r, q)));
}

// Every value present in the whole flagged list, in the order the rail
// should show them, mapped to how many rows would pass with that value
// added. Values keep their place (and show their zero) rather than
// disappearing as other filters narrow the list.
function facetCounts(dimension) {
  const counts = new Map();
  const valuesFor = (r) => {
    if (dimension === 'client') return assignmentsOf(r).map(a => a.key);
    if (dimension === 'position') return assignmentsOf(r).map(a => a.position);
    if (dimension === 'urgency') return [urgencyOf(r)];
    const committee = committeeOf(r);
    return committee ? [committee] : [];
  };
  for (const r of currentRows) for (const v of valuesFor(r)) counts.set(v, 0);
  for (const r of currentRows) {
    if (!rowPasses(r, dimension)) continue;
    for (const v of new Set(valuesFor(r))) counts.set(v, counts.get(v) + 1);
  }

  // Stable, meaningful order per dimension: clients alphabetically,
  // positions and urgency in their declared order, committees
  // alphabetically. "No client" always last — it's the absence of a
  // value, not one of them.
  let keys = Array.from(counts.keys());
  if (dimension === 'position') {
    keys = ['support', 'oppose', 'watch', UNASSIGNED].filter(k => counts.has(k));
  } else if (dimension === 'urgency') {
    keys = URGENCY_BUCKETS.map(([v]) => v).filter(k => counts.has(k));
  } else {
    keys.sort((a, b) => {
      if (a === UNASSIGNED) return 1;
      if (b === UNASSIGNED) return -1;
      return valueLabel(dimension, a).localeCompare(valueLabel(dimension, b));
    });
  }
  return keys.map(key => [key, counts.get(key)]);
}

function activeFilterCount() {
  return DIMENSIONS.reduce((n, d) => n + filters[d.key].size, 0);
}

function toggleFilter(dimension, value) {
  const picked = filters[dimension];
  if (picked.has(value)) picked.delete(value); else picked.add(value);
  applyFilters();
}

function clearFilters() {
  for (const d of DIMENSIONS) filters[d.key].clear();
  if (searchEl) searchEl.value = '';
  applyFilters();
}

/* ── The rail ──────────────────────────────────────────────────────── */

function renderRail() {
  if (!currentRows.length) { railEl.innerHTML = ''; return; }

  const groups = DIMENSIONS.map(dimension => {
    const values = facetCounts(dimension.key);
    // One option filters nothing, and "No client" on its own is one
    // option dressed as two.
    if (values.filter(([v]) => v !== UNASSIGNED).length < 2) return '';
    const tabs = values.map(([value, n]) => {
      const on = filters[dimension.key].has(value);
      return `<button type="button" class="filter-tab${on ? ' active' : ''}"
        aria-pressed="${on}" ${n || on ? '' : 'disabled'}
        onclick="toggleFilter('${dimension.key}', ${JSON.stringify(value).replace(/"/g, '&quot;')})"
        >${escapeText(valueLabel(dimension.key, value))}<span class="n">${n}</span></button>`;
    }).join('');
    return `<div class="filter-group"><span class="filter-group-label">${dimension.label}</span>${tabs}</div>`;
  }).join('');

  railEl.innerHTML = `<div class="search-filters">
    ${groups}
    ${activeChipsHtml()}
    ${savedViewsHtml()}
  </div>`;
}

// The same state the tabs carry, restated as one removable line. With
// four dimensions set, that line is the only place the whole narrowing
// is visible without reading the entire rail.
function activeChipsHtml() {
  if (!activeFilterCount()) return '';
  const chips = DIMENSIONS.flatMap(d =>
    Array.from(filters[d.key]).map(value =>
      `<button type="button" class="filter-chip"
         onclick="toggleFilter('${d.key}', ${JSON.stringify(value).replace(/"/g, '&quot;')})"
         aria-label="Remove filter ${escapeText(valueLabel(d.key, value))}"
         >${escapeText(valueLabel(d.key, value))}<span class="x">×</span></button>`)
  ).join('');
  return `<div class="active-filters">${chips}
    <button type="button" class="secondary filter-clear" onclick="clearFilters()">Clear all</button></div>`;
}

/* ── The URL is the view ───────────────────────────────────────────────
 *
 * Everything above lives in the query string, which is what makes a
 * composition shareable at all: "here's the list I'm looking at" is a
 * link in an email to a colleague, and a saved view is that same string
 * stored under a name. replaceState rather than pushState — narrowing a
 * filter isn't a place to come Back to, and twelve clicks shouldn't cost
 * twelve presses of the browser's back button.
 */
function currentQueryString() {
  const params = new URLSearchParams();
  const q = (searchEl ? searchEl.value : '').trim();
  if (q) params.set('q', q);
  for (const d of DIMENSIONS) {
    if (filters[d.key].size) params.set(d.key, Array.from(filters[d.key]).join(','));
  }
  if (groupByClient) params.set('group', 'client');
  if (sortBy && sortBy !== 'next_action') params.set('sort', sortBy);
  return params.toString();
}

function syncUrl() {
  const query = currentQueryString();
  history.replaceState(null, '', query ? `${location.pathname}?${query}` : location.pathname);
}

function applyQueryString(query) {
  const params = new URLSearchParams(query);
  for (const d of DIMENSIONS) {
    filters[d.key] = new Set((params.get(d.key) || '').split(',').filter(Boolean));
  }
  if (searchEl) searchEl.value = params.get('q') || '';
  groupByClient = params.get('group') === 'client';
  if (groupEl) groupEl.checked = groupByClient;
  const sort = params.get('sort');
  if (sort) {
    sortBy = sort;
    if (sortSelectEl) sortSelectEl.value = sort;
  }
}

/* ── Saved views ───────────────────────────────────────────────────── */

async function loadSavedViews() {
  try {
    const res = await fetch('/api/saved-views');
    savedViews = res.ok ? await res.json() : [];
  } catch (err) {
    savedViews = [];
  }
}

function savedViewsHtml() {
  const views = savedViews.map(v =>
    `<span class="saved-view">
       <button type="button" class="filter-tab" onclick="openSavedView(${v.id})">${escapeText(v.name)}</button>
       <button type="button" class="icon-btn" onclick="removeSavedView(${v.id})"
               aria-label="Delete the view ${escapeText(v.name)}" title="Delete this view">×</button>
     </span>`).join('');
  const save = activeFilterCount() || searchQuery() || groupByClient
    ? `<button type="button" class="secondary filter-clear" onclick="saveCurrentView()">Save this view</button>`
    : '';
  if (!views && !save) return '';
  return `<div class="active-filters saved-views">
    <span class="filter-group-label">Views</span>${views}${save}</div>`;
}

function openSavedView(viewId) {
  const view = savedViews.find(v => v.id === viewId);
  if (!view) return;
  applyQueryString(view.query);
  applyFilters();
}

async function saveCurrentView() {
  const name = prompt('Name this view — e.g. "UCSA — Thursday call"');
  if (name === null) return;
  errorEl.className = '';
  try {
    const res = await fetch('/api/saved-views', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, query: currentQueryString() }),
    });
    const list = await res.json();
    if (!res.ok) throw new Error(list.error || 'Could not save that view');
    savedViews = list;
    renderRail();
    showToast(`Saved "${name.trim()}". It keeps these filters, not these bills.`);
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  }
}

async function removeSavedView(viewId) {
  const view = savedViews.find(v => v.id === viewId);
  const ok = await confirmDelete(
    'Delete this view?',
    `Delete "${view ? view.name : 'this view'}"? The bills and positions it filtered are untouched — only the saved filter goes.`);
  if (!ok) return;
  errorEl.className = '';
  try {
    const res = await fetch(`/api/saved-views?id=${viewId}`, { method: 'DELETE' });
    const list = await res.json();
    if (!res.ok) throw new Error(list.error || 'Could not delete that view');
    savedViews = list;
    renderRail();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  }
}

/* ── Export ────────────────────────────────────────────────────────────
 *
 * The weekly client update was a retype: nothing left this app as a
 * file. This exports the CURRENT view — the same rows, the same order,
 * and when grouped by client, one row per bill-client pair so the
 * grouping survives into the spreadsheet. A file that quietly held
 * something other than what was on screen would be worse than no
 * export.
 */
function csvCell(value) {
  const text = value === null || value === undefined ? '' : String(value);
  // Every cell quoted, not just the ones that need it: one rule to read,
  // and no chance of a title with a comma in it shifting every column
  // after it.
  return `"${text.replace(/"/g, '""')}"`;
}

function nextActionText(r) {
  if (r.next_hearing) {
    const parts = [`Hearing ${r.next_hearing.date}`];
    const time = hearingTimeLabel ? hearingTimeLabel(r.next_hearing.time) : r.next_hearing.time;
    if (time) parts.push(time);
    return parts.join(' · ');
  }
  if (r.amend_by_date) return `Amend by ${r.amend_by_date}`;
  return 'Nothing scheduled';
}

function csvRows() {
  const header = ['Bill', 'Title', 'Client', 'Position', 'Status', 'Status date',
                  'Next action', 'Committee', 'Last change', 'LegiScan URL'];
  const rows = [];
  const push = (r, clientLabel, position) => rows.push([
    `${r.state} ${r.bill_number}`, r.title || '', clientLabel, position,
    r.status_label || '', r.status_date || '', nextActionText(r),
    committeeOf(r) || '', (r.last_change && r.last_change.summary) || '', r.url || '',
  ]);

  if (groupByClient) {
    for (const [clientLabel, groupRows] of groupedRows()) {
      for (const r of groupRows) {
        const assigned = (r.assigned_clients || []).find(c => c.name === clientLabel);
        push(r, clientLabel, assigned ? positionLabel(assigned.position || 'watch') : '');
      }
    }
  } else {
    for (const r of visibleRows()) {
      const assigned = r.assigned_clients || [];
      push(r, assigned.map(c => c.name).join('; '),
           assigned.map(c => positionLabel(c.position || 'watch')).join('; '));
    }
  }
  return [header, ...rows];
}

function csvText() {
  return csvRows().map(row => row.map(csvCell).join(',')).join('\r\n') + '\r\n';
}

function exportCsv() {
  const rows = csvRows();
  if (rows.length < 2) {
    showToast('Nothing to export — no bills match these filters.');
    return;
  }
  // A BOM so Excel opens a UTF-8 file as UTF-8 rather than mangling the
  // em dashes and accented client names this data actually contains.
  const blob = new Blob(['\ufeff' + csvText()], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `flagged-bills-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  showToast(`Exported ${rows.length - 1} row${rows.length === 2 ? '' : 's'}.`);
}

/* ── Grouping ──────────────────────────────────────────────────────────
 *
 * One section per client, alphabetically, and a bill assigned to three
 * clients appears under all three — which is what "group by client"
 * means and the whole point when the output is a per-client update.
 * Unassigned bills get a section of their own at the end rather than
 * being dropped, since "which of these has nobody" is one of the two
 * numbers the tiles above already count.
 */
function groupedRows() {
  const rows = visibleRows();
  const byClient = new Map();
  const unassigned = [];
  for (const r of rows) {
    const assigned = (r.assigned_clients || []);
    // A client filter narrows the SECTIONS too — grouping by client
    // while filtered to UCSA should not print every other client's
    // section for a bill UCSA happens to share.
    const shown = filters.client.size
      ? assigned.filter(c => filters.client.has(String(c.id)))
      : assigned;
    if (!shown.length) { unassigned.push(r); continue; }
    for (const c of shown) {
      if (!byClient.has(c.name)) byClient.set(c.name, []);
      byClient.get(c.name).push(r);
    }
  }
  const sections = Array.from(byClient.entries())
    .sort((a, b) => a[0].localeCompare(b[0]));
  if (unassigned.length) sections.push(['No client assigned', unassigned]);
  return sections;
}

function applyFilters() {
  syncUrl();
  renderRail();
  render(visibleRows());
}

if (groupEl) {
  groupEl.addEventListener('change', () => {
    groupByClient = groupEl.checked;
    applyFilters();
  });
}

if (searchEl) {
  searchEl.addEventListener('input', applyFilters);
}

async function load() {
  try {
    const [flaggedRes, clientsRes] = await Promise.all([
      fetch('/api/flagged'), fetch('/api/clients'),
      loadSavedViews(),
    ]);
    if (flaggedRes.status === 401) {
      window.location.href = '/login';
      return;
    }
    allClients = await clientsRes.json();
    currentRows = await flaggedRes.json();
    renderStats();
    renderFreshness();
    applyFilters();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  } finally {
    loadingEl.className = '';
  }
}

// When the refresh job last ran, said once here instead of repeated down
// a column. It was the same value on every row by construction —
// touch_watchlist() stamps every bill on every run whether or not
// anything changed — so as a column it trained the reader to ignore the
// one place a date could have carried urgency. The row-level question is
// "what changed", which is a different field entirely (see
// lastChangeCell).
function renderFreshness() {
  const el = document.getElementById('freshness');
  if (!el) return;
  const stamps = currentRows.map(r => r.last_checked_at).filter(Boolean).sort();
  const latest = stamps[stamps.length - 1];
  el.textContent = latest ? `Checked ${fmtDateTime(latest)}` : '';
}

// A friendly "Aug 24, 2:03 PM" instead of the raw
// "2026-08-24T14:03:00" ISO string the API returns.
function fmtDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso.includes('Z') || iso.includes('+') ? iso : iso + 'Z');
  if (isNaN(d)) return iso;
  return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

// "Sep 8" — the year is only worth the width when it isn't the obvious one.
function fmtShortDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return dateStr;
  const opts = { month: 'short', day: 'numeric' };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString('en-US', opts);
}

// The unread marker: this bill has changes recorded since the last time
// this user opened its report (see db._unread_counts_for_bills). What
// turns the list from an inventory of what you track into a queue of
// what you haven't dealt with.
//
// A dot plus a number, not a dot alone — "3 changes you haven't seen" is
// worth more than "something happened", and the count is already in
// hand. The title and the screen-reader text carry the same sentence,
// since a coloured dot means nothing on its own to someone who can't see
// it or doesn't know the convention.
function unreadDot(r) {
  const count = r.unread_count || 0;
  if (!count) return '';
  const label = count === 1 ? '1 change you haven\u2019t seen' : `${count} changes you haven\u2019t seen`;
  return `<span class="unread-dot" title="${label}"><span class="sr-only">${label}. </span>${count}</span>`;
}

// What actually moved on this bill, and when.
//
// last_change is the app's own observation, recorded by the refresh job
// (see bill_change_events) — precise, and the only thing that can say a
// bill was *amended* without its status having changed. It only exists
// from the first refresh after that table shipped, so there's a fallback:
// latest_activity_date, the newest date in the bill's own recorded
// history. That's a weaker claim — it's the date of the bill's last
// action, not something we watched happen — so it's labelled as such
// rather than dressed up as a detected change.
function lastChangeCell(r) {
  const change = r.last_change;
  if (change) {
    // event_date is the date the change *carries*, which is only the date
    // it happened for things that already happened. A newly scheduled
    // hearing carries a future date — printing that under "Last change"
    // claimed the bill changed next month. So a future event_date falls
    // back to when the refresh actually saw it.
    const detected = (change.detected_at || '').slice(0, 10);
    const when = (change.event_date && change.event_date <= detected) ? change.event_date : detected;
    const also = change.also_count ? ` +${change.also_count} more` : '';
    return `
      <div class="change-when">${fmtShortDate(when)}</div>
      <div class="change-what${r.unread_count ? ' unread' : ''}" title="${(change.description || '').replace(/"/g, '&quot;')}">${change.summary || ''}${also}</div>
    `;
  }
  if (r.latest_activity_date) {
    return `
      <div class="change-when">${fmtShortDate(r.latest_activity_date)}</div>
      <div class="change-what none">Last recorded action</div>
    `;
  }
  return '<div class="change-what none">No activity recorded</div>';
}

// Statuses where the bill has stopped moving, so there is no next date
// to wait for. Keyed on the same lowercase status_label the Status column
// shows, which is a small closed vocabulary from LegiScan.
const TERMINAL_STATUSES = {
  failed: 'This bill is dead',
  vetoed: 'Vetoed by the Governor',
  passed: 'Passed the Legislature',
};

// What this bill needs from the user next, in the shapes the data
// actually supports: a scheduled hearing, a bill sitting on the
// Governor's desk, or nothing dated. Deliberately not guessing beyond
// those — an invented "next step" on a compliance screen is worse than
// an honest "No date set".
function nextActionCell(r) {
  const hearing = r.next_hearing;
  if (hearing) {
    const days = hearing.days_until;
    const where = hearing.location || hearing.description || hearing.event_type || '';
    let chip = '';
    if (days === 0) chip = '<span class="next-chip now">Today</span>';
    else if (days === 1) chip = '<span class="next-chip now">Tomorrow</span>';
    else if (days !== null && days <= 7) chip = `<span class="next-chip">In ${days} days</span>`;
    return `
      <div class="next-when">${fmtShortDate(hearing.date)} · ${hearingTimeLabel(hearing.time)}</div>
      ${where ? `<div class="next-where">${where}</div>` : ''}
      ${chip}
    `;
  }
  // The user's own amendment deadline (see the Current Status card on
  // the bill report, where it's entered). Only reached when LegiScan has
  // nothing scheduled — a real hearing outranks a personal reminder —
  // and labelled as the reminder it is rather than dressed up as a
  // legislative date.
  if (r.amend_by_days_until !== null && r.amend_by_days_until !== undefined) {
    const days = r.amend_by_days_until;
    let chip = '';
    if (days === 0) chip = '<span class="next-chip now">Today</span>';
    else if (days === 1) chip = '<span class="next-chip now">Tomorrow</span>';
    else if (days <= 7) chip = `<span class="next-chip">In ${days} days</span>`;
    return `
      <div class="next-when">${fmtShortDate(r.amend_by_date)}</div>
      <div class="next-where">Your amendment deadline</div>
      ${chip}
    `;
  }
  const status = (r.status_label || '').toLowerCase();
  if (status === 'enrolled') {
    return '<div class="next-when">Awaiting signature</div><div class="next-where">Sent to the Governor</div>';
  }
  // A bill that's finished moving needs to say so. "No date set" on a
  // dead bill reads as "a date hasn't been announced yet" and quietly
  // invites the user to keep waiting for one. Each sub-line just restates
  // the status field rather than inferring anything past it.
  if (TERMINAL_STATUSES[status]) {
    return `<div class="next-when none">No further action</div><div class="next-where">${TERMINAL_STATUSES[status]}</div>`;
  }
  return '<div class="next-when none">No date set</div>';
}

async function unflag(billId) {
  // Unflagging drops the bill's tracked position/client context with no
  // undo — same real confirmation as removeClient() (see
  // CONFIRM_DELETE_JS), not the browser's own confirm().
  const r = currentRows.find(x => x.bill_id === billId);
  const label = r ? `${r.state} ${r.bill_number}` : 'this bill';
  const clientNote = r && (r.assigned_clients || []).length
    ? ' This also removes its assigned client(s) and saved position(s).'
    : '';
  const ok = await confirmDelete('Unflag this bill?', `Unflag ${label}?${clientNote} This can't be undone.`);
  if (!ok) return;
  errorEl.className = '';
  try {
    const res = await fetch(`/api/flag?bill_id=${billId}`, { method: 'DELETE' });
    if (!res.ok) {
      const data = await res.json();
      throw new Error(data.error || 'Could not unflag bill');
    }
    load();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  }
}

// One <tr>, so the flat table and the grouped sections render the same
// row rather than two drifting copies of it.
function rowHtml(r) {
  return `
        <tr>
          <td class="col-bill">
            <div class="bill-row">
              <div class="bill-icon">
                <svg viewBox="0 0 14 14" fill="currentColor"><rect x="1" y="1" width="5" height="5" rx="1"/><rect x="8" y="1" width="5" height="5" rx="1"/><rect x="1" y="8" width="5" height="5" rx="1"/><rect x="8" y="8" width="5" height="5" rx="1"/></svg>
              </div>
              <div class="bill-main">
                <div class="bill-ident">${unreadDot(r)}${r.state} ${r.bill_number}</div>
                <div class="bill-name" title="${(r.title || '').replace(/"/g, '&quot;')}">${r.title || ''}</div>
              </div>
              <div class="row-menu">
                <button type="button" class="row-menu-btn" onclick="toggleRowMenu(event, ${r.bill_id})" aria-label="Bill actions" aria-haspopup="true" aria-expanded="false" aria-controls="row-menu-${r.bill_id}">
                  <svg viewBox="0 0 14 14" fill="currentColor"><circle cx="7" cy="3" r="1.6"/><circle cx="7" cy="7" r="1.6"/><circle cx="7" cy="11" r="1.6"/></svg>
                </button>
                <div class="row-menu-dropdown" id="row-menu-${r.bill_id}">
                  <button type="button" onclick="unflag(${r.bill_id})">Unflag this bill</button>
                </div>
              </div>
            </div>
            <div class="row-actions">
              <a class="secondary" href="/report?bill_id=${r.bill_id}">Bill report</a>
              ${r.url ? `<a class="secondary" href="${r.url}" target="_blank" rel="noopener">LegiScan ↗</a>` : ''}
            </div>
          </td>
          <td class="col-next next-action">${nextActionCell(r)}</td>
          <td class="col-status">${statusBadgeHtml(r.status_label)}</td>
          <td class="col-change">${lastChangeCell(r)}</td>
          <td class="col-clients">${billClientCellHtml(r.bill_id)}</td>
        </tr>
`;
}

const TABLE_HEAD = `<thead><tr><th class="col-bill">Bill</th><th class="col-next">Next action</th><th class="col-status">Status</th><th class="col-change">Last change</th><th class="col-clients">Clients &amp; positions</th></tr></thead>`;

// What is narrowing the list, in words, for the empty state. The rail
// above already shows it as controls; a user who has filtered themselves
// down to nothing needs the sentence, because the thing they got wrong
// is usually a filter they forgot was on.
function narrowingDescription() {
  const parts = DIMENSIONS.flatMap(d =>
    Array.from(filters[d.key]).map(v => valueLabel(d.key, v)));
  const q = (searchEl ? searchEl.value : '').trim();
  if (q) parts.push(`matching "${q}"`);
  return parts.length ? ` for ${parts.join(', ')}` : '';
}

function render(rows) {
  if (!currentRows.length) {
    listEl.innerHTML = '<p class="empty">Nothing flagged yet — look up a bill and click "Flag this bill" from there.</p>';
    return;
  }
  if (!rows.length) {
    listEl.innerHTML = `<p class="empty">No flagged bills${narrowingDescription()} right now — try
      <a href="#" onclick="event.preventDefault(); clearFilters()">clearing filters</a>.</p>`;
    return;
  }

  if (groupByClient) {
    const sections = groupedRows();
    listEl.innerHTML = sections.map(([name, groupRows]) => `
      <div class="row-group">
        <div class="row-group-head">
          <span class="row-group-name">${escapeText(name)}</span>
          <span class="row-group-count">${groupRows.length} bill${groupRows.length === 1 ? '' : 's'}</span>
        </div>
        <div class="table-scroll">
          <table class="bill-cards">${TABLE_HEAD}<tbody>${groupRows.map(rowHtml).join('')}</tbody></table>
        </div>
      </div>
    `).join('') + statusLegendHtml(rows.map(r => r.status_label));
    return;
  }

  listEl.innerHTML = `
    <div class="table-scroll">
    <table class="bill-cards">
      ${TABLE_HEAD}
      <tbody>
      ${rows.map(rowHtml).join('')}
      </tbody>
    </table>
    </div>
    ${statusLegendHtml(rows.map(r => r.status_label))}
  `;
}

// A bookmarked or shared link arrives with the whole view in it, so the
// filters have to be in place before the first render — not applied
// after it as a visible re-narrowing.
applyQueryString(location.search);

load();
</script>
