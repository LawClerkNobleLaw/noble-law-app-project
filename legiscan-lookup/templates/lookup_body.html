
<div class="page-head">
  <div>
    <h1>Search bills</h1>
    <p class="sub">Look up an exact bill number or search free text across every California bill — powered by LegiScan.</p>
  </div>
</div>

<div class="card">
  <form id="f" style="margin:0">
    <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Bill number or search terms</label>
    <input id="q" placeholder="e.g. SB122, or housing element, cannabis licensing…" required style="flex:1">
    <button type="submit">Search</button>
  </form>
</div>

<div class="panel" id="saved-panel" hidden style="margin-bottom:1rem">
  <div class="panel-head">
    <div>
      <div class="title">Saved searches</div>
      <div class="sub">Re-run every morning. New matches arrive in your daily digest.</div>
    </div>
  </div>
  <div id="saved-list"></div>
</div>

<div id="loading" class="skeleton">
  <div class="panel">
    {{top_nav}}
  </div>
</div>
<div id="error" role="alert" aria-live="assertive"></div>
<div id="results"></div>

<script src="{{CONFIRM_DELETE_SRC}}"></script>
<script src="{{BILL_STATUS_SRC}}"></script>
<script src="{{TOAST_SRC}}"></script>
<script src="{{POSITION_HISTORY_SRC}}"></script>
<script src="{{TITLE_CASE_SRC}}"></script>
<script>
const form = document.getElementById('f');
const resultsEl = document.getElementById('results');
const errorEl = document.getElementById('error');
const loadingEl = document.getElementById('loading');
let currentQuery = '';
let currentPage = 1;
// The rows as last rendered, so a flag toggle can repaint one row
// without re-running the search (and spending another LegiScan call).
let currentResults = [];
// Bills picked for "flag selected". Kept across a page change within the
// same search — someone paging through 119 results is doing one triage
// pass, not three.
let selectedBillIds = new Set();
// "Hide bills I already track". Half a broad result set is usually
// bills the user settled last week.
let hideTracked = false;
let allClients = [];

// Only used by the "flag selected" bar's client picker. A signed-out
// visitor gets an empty list and no picker, which is right — they can't
// flag anything either.
fetch('/api/clients').then(res => res.ok ? res.json() : []).then(list => { allClients = list || []; }).catch(() => {});
loadSavedSearches();

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (q) runSearch(q, 1);
});

// Two different things prefill this page: the global header search
// box + any old /discover?q=... bookmark send ?q=..., while a link
// that already knows an exact bill number (billPills() elsewhere in
// this app, and the ?next=... round trip _redirect_to_login() builds)
// sends ?bill=... — both just seed the same one search box now that
// lookup and discovery are a single page.
const urlParams = new URLSearchParams(window.location.search);
const prefillQuery = urlParams.get('q') || urlParams.get('bill');
if (prefillQuery) {
  document.getElementById('q').value = prefillQuery;
  runSearch(prefillQuery, 1);
}

async function runSearch(q, page) {
  currentQuery = q; currentPage = page;
  errorEl.className = ''; loadingEl.className = 'skeleton show'; resultsEl.innerHTML = '';
  form.querySelector('button').disabled = true;

  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&page=${page}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Search failed');
    renderResults(data);
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  } finally {
    loadingEl.className = 'skeleton';
    form.querySelector('button').disabled = false;
  }
}

// LegiScan's search doesn't return a coded status the way getBill does
// (see shape_bill() in legiscan_client.py) — just each result's own
// last_action text. That text is mapped into the same status words
// every other screen in this app uses (see bill_status.js), and the
// pill it produces marks itself as inferred, so a search row and the
// bill page it opens no longer describe the same bill in two different
// vocabularies.

function snippet(title) {
  if (!title) return '';
  return title.length > 140 ? title.slice(0, 140).trim() + '…' : title;
}

// Every search — one hit or a hundred — renders as this same row
// list, one consistent UI regardless of result count. Clicking any
// row goes to the full action report rather than expanding detail in
// place (see REPORT_BODY, which now also has "Flag this bill" for a
// bill that isn't flagged yet).
function renderResults(data) {
  currentResults = data.results || [];
  signedIn = !!data.signed_in;
  renderRows(data);
}

let signedIn = false;

// Everything below re-renders from currentResults rather than re-running
// the search: a flag toggle, a selection, and the "hide tracked" filter
// all change what's on screen without changing what LegiScan was asked,
// and a second search would cost another API call for the same answer.
function renderRows(meta) {
  const all = currentResults;
  if (!all.length) {
    resultsEl.innerHTML = '<p class="empty">No bills match that search. Try a broader term, check the spelling, or a different bill number.</p>';
    return;
  }
  const rows = hideTracked ? all.filter(r => !r.flagged) : all;
  const trackedCount = all.filter(r => r.flagged).length;

  // from_label/from_href tell /report where this click came from, so its
  // back link and sidebar highlight can point back to Lookup instead of
  // always assuming Flagged Bills (see REPORT_BODY's own script for the
  // read side of this). from_href carries the query itself now — the
  // back link used to land on an empty search box, so returning from a
  // bill meant retyping the search that found it.
  const backHref = encodeURIComponent('/lookup?q=' + encodeURIComponent(currentQuery));
  const reportHref = (billId) => `/report?bill_id=${billId}&from_label=Search&from_href=${backHref}`;

  const rowsHtml = rows.map(r => `
    <tr class="${r.flagged ? 'tracked-row' : ''}">
      <td class="pick-cell">
        ${signedIn && !r.flagged
          ? `<input type="checkbox" aria-label="Select ${r.bill_number}" ${selectedBillIds.has(r.bill_id) ? 'checked' : ''} onchange="toggleSelected(${r.bill_id}, this.checked)">`
          : ''}
      </td>
      <td><a href="${reportHref(r.bill_id)}">${r.bill_number}</a></td>
      <td>
        <a class="result-title" href="${reportHref(r.bill_id)}">${snippet(r.title)}</a>
        ${trackedChipsHtml(r)}
      </td>
      <td>${statusBadgeHtml(billStatusFromAction(r.last_action).label, { inferred: true })}</td>
      <td class="date">${r.last_action_date || ''}</td>
      <td class="flag-cell">${flagButtonHtml(r)}</td>
    </tr>
  `).join('');

  const count = meta && meta.count ? meta.count : all.length;
  const page = (meta && meta.page) || currentPage;
  const pageTotal = (meta && meta.page_total) || 1;
  const hasMore = pageTotal && Number(page) < Number(pageTotal);
  const legend = statusLegendHtml(rows.map(r => billStatusFromAction(r.last_action).label));

  resultsEl.innerHTML = `
    ${selectionBarHtml()}
    <div class="panel">
      <div class="panel-head">
        <div class="sub" style="margin:0">${count.toLocaleString()} bill${count === 1 ? '' : 's'} match — showing page ${page} of ${pageTotal}</div>
        <div style="display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap">
        ${signedIn ? `
        ${allClients.length ? `
        <label class="sub" style="margin:0">for
          <select id="save-search-client">
            <option value="">no client</option>
            ${allClients.map(c => `<option value="${c.id}">${titleCaseName(c.name)}</option>`).join('')}
          </select>
        </label>` : ''}
        <button type="button" class="secondary" onclick="saveCurrentSearch()">Save this search</button>` : ''}
        ${trackedCount ? `
        <label class="sub" style="display:flex;align-items:center;gap:0.35rem;margin:0">
          <input type="checkbox" ${hideTracked ? 'checked' : ''} onchange="setHideTracked(this.checked)">
          Hide the ${trackedCount} I already track
        </label>` : ''}
        </div>
      </div>
      <div style="overflow-x:auto">
      <table><thead><tr><th class="pick-cell"></th><th>Bill</th><th>Title</th><th>Status</th><th>Last action</th><th></th></tr></thead><tbody>${rowsHtml}</tbody></table>
      </div>
      ${rows.length ? legend : '<p class="empty" style="padding:1rem 1.15rem">Every bill on this page is one you already track.</p>'}
    </div>
    ${hasMore ? '<div style="text-align:center;margin-top:1rem"><button type="button" class="secondary" id="next-page-btn">Next page →</button></div>' : ''}
  `;
  if (hasMore) {
    document.getElementById('next-page-btn').addEventListener('click', () => runSearch(currentQuery, currentPage + 1));
  }
}

// What the user has already decided about this bill, on the row where
// they're deciding again. Without it a results page asks them to
// re-evaluate bills they settled last week, and the answer was one join
// away the whole time.
function trackedChipsHtml(r) {
  if (!r.flagged) return '';
  const clients = r.clients || [];
  if (!clients.length) return '<div class="result-tracked">Tracked · no client assigned</div>';
  return `<div class="result-tracked">${clients.map(c =>
    `<span class="position-badge ${c.position}">${titleCaseName(c.name)} · ${positionLabel(c.position)}</span>`
  ).join(' ')}</div>`;
}

function flagButtonHtml(r) {
  if (!signedIn) return '';
  if (r.flagged) return '<span class="sub" title="Already on your flagged list">🚩 Flagged</span>';
  return `<button type="button" class="secondary" onclick="flagOne(${r.bill_id})">Flag</button>`;
}

// One row's flag, without leaving the page. Flagging used to mean
// opening the bill, pressing "Flag this bill", and coming back to an
// empty search box.
async function flagOne(billId) {
  errorEl.className = '';
  const row = currentResults.find(r => r.bill_id === billId);
  try {
    const res = await fetch('/api/flag', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bill_id: billId }),
    });
    if (!res.ok) {
      const data = await res.json();
      throw new Error(data.error || 'Could not flag that bill');
    }
    if (row) { row.flagged = true; row.clients = []; }
    selectedBillIds.delete(billId);
    renderRows();
    showToast(`${row ? row.bill_number : 'Bill'} flagged. It's checked every morning from now on.`);
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  }
}

function toggleSelected(billId, checked) {
  if (checked) selectedBillIds.add(billId); else selectedBillIds.delete(billId);
  renderRows();
}

function setHideTracked(checked) {
  hideTracked = checked;
  renderRows();
}

// The bar only exists while something is selected — an empty "0 selected"
// toolbar is a permanent piece of furniture for an occasional action.
function selectionBarHtml() {
  const n = selectedBillIds.size;
  if (!n) return '';
  const clientOptions = allClients.map(c =>
    `<option value="${c.id}">${titleCaseName(c.name)}</option>`
  ).join('');
  return `
    <div class="selection-bar">
      <span class="selection-count">${n} bill${n === 1 ? '' : 's'} selected</span>
      ${allClients.length ? `
        <label class="sub" style="margin:0">Assign to
          <select id="bulk-client">
            <option value="">no client yet</option>
            ${clientOptions}
          </select>
        </label>
        <label class="sub" style="margin:0">as
          <select id="bulk-position">
            <option value="watch">Watch</option>
            <option value="support">Support</option>
            <option value="oppose">Oppose</option>
          </select>
        </label>` : ''}
      <button type="button" id="bulk-flag-btn" onclick="flagSelected()">Flag selected</button>
      <button type="button" class="secondary" onclick="clearSelection()">Clear</button>
    </div>
  `;
}

function clearSelection() {
  selectedBillIds.clear();
  renderRows();
}

// "Flag these four for UCSA" in one request — see /api/flag-bulk, which
// still makes one LegiScan call per bill but saves the four page round
// trips and three re-searches doing it by hand used to cost.
async function flagSelected() {
  const ids = Array.from(selectedBillIds);
  if (!ids.length) return;
  errorEl.className = '';
  const clientEl = document.getElementById('bulk-client');
  const positionEl = document.getElementById('bulk-position');
  const btn = document.getElementById('bulk-flag-btn');
  btn.disabled = true;
  btn.textContent = `Flagging ${ids.length}…`;
  try {
    const res = await fetch('/api/flag-bulk', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        bill_ids: ids,
        client_id: clientEl && clientEl.value ? Number(clientEl.value) : null,
        position: positionEl ? positionEl.value : 'watch',
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not flag those bills');
    const clientName = clientEl && clientEl.value
      ? (allClients.find(c => String(c.id) === clientEl.value) || {}).name : '';
    for (const row of currentResults) {
      if (!data.flagged.includes(row.bill_id)) continue;
      row.flagged = true;
      row.clients = clientName
        ? [{ id: Number(clientEl.value), name: clientName, position: positionEl.value }] : [];
      selectedBillIds.delete(row.bill_id);
    }
    renderRows();
    // A bill LegiScan couldn't be reached for is named rather than
    // silently left unflagged — the user picked it on purpose.
    if (data.failed.length) {
      errorEl.textContent = `Flagged ${data.flagged.length}. Couldn't reach LegiScan for ${data.failed.length} of them — try those again.`;
      errorEl.className = 'show';
    } else {
      showToast(`${data.flagged.length} bill${data.flagged.length === 1 ? '' : 's'} flagged${clientName ? ' for ' + titleCaseName(clientName) : ''}.`);
    }
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Flag selected';
  }
}
/* ── Saved searches ────────────────────────────────────────────────────
 *
 * The hole this fills: monitoring only ever applied to bills already
 * flagged, so the daily job could not see the bill introduced last week
 * that nobody has noticed — which is the one that hurts a client. A
 * saved search is a query the refresh job re-runs every morning,
 * reporting what wasn't matching yesterday.
 *
 * The list also gives this page something to be when it's empty. It
 * used to be a heading, a sentence and an input, which asks the user to
 * already know what they want.
 */
let savedSearches = [];

async function loadSavedSearches() {
  try {
    const res = await fetch('/api/saved-searches');
    if (!res.ok) return;               // Signed out — no panel, no error.
    savedSearches = await res.json();
    renderSavedSearches();
  } catch (err) { /* The page works without it. */ }
}

function renderSavedSearches() {
  const panel = document.getElementById('saved-panel');
  panel.hidden = !savedSearches.length;
  document.getElementById('saved-list').innerHTML = savedSearches.map(sv => `
    <div class="saved-row">
      <div class="saved-main">
        <button type="button" class="saved-name" onclick="runSavedSearch(${sv.id})">${escapeText(sv.name)}</button>
        ${sv.new_match_count ? `<span class="unread-dot" title="${sv.new_match_count} new since you last looked"><span class="sr-only">${sv.new_match_count} new since you last looked. </span>${sv.new_match_count}</span>` : ''}
        <div class="saved-meta">${escapeText(sv.query)}${sv.client_name ? ` · for ${escapeText(sv.client_name)}` : ''}</div>
      </div>
      <button type="button" class="icon-btn" onclick="deleteSavedSearch(${sv.id})" aria-label="Delete saved search" title="Delete">×</button>
    </div>
  `).join('');
}

function escapeText(text) {
  return String(text == null ? '' : text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Running a saved search is seeing its new matches, so the count clears
// here the same way it does when a digest goes out — otherwise the app
// and the email would disagree about what the user has been told.
function runSavedSearch(id) {
  const saved = savedSearches.find(s => s.id === id);
  if (!saved) return;
  document.getElementById('q').value = saved.query;
  runSearch(saved.query, 1);
  if (!saved.new_match_count) return;
  fetch('/api/saved-searches/seen', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id }),
  }).then(res => res.ok ? res.json() : null).then(list => {
    if (list) { savedSearches = list; renderSavedSearches(); }
  }).catch(() => {});
}

async function deleteSavedSearch(id) {
  const saved = savedSearches.find(s => s.id === id);
  const ok = await confirmDelete(
    'Delete saved search?',
    `Delete \u201c${saved ? saved.name : 'this search'}\u201d? It stops running every morning. Bills you already flagged from it stay flagged.`
  );
  if (!ok) return;
  try {
    const res = await fetch(`/api/saved-searches?id=${id}`, { method: 'DELETE' });
    const list = await res.json();
    if (!res.ok) throw new Error(list.error || 'Could not delete that saved search');
    savedSearches = list;
    renderSavedSearches();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  }
}

// Offered on the results panel once a search has actually returned
// something — saving a query that matches nothing is saving a typo.
async function saveCurrentSearch() {
  const name = window.prompt('Name this search', currentQuery);
  if (name === null) return;
  const clientEl = document.getElementById('save-search-client');
  errorEl.className = '';
  try {
    const res = await fetch('/api/saved-searches', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name, query: currentQuery,
        client_id: clientEl && clientEl.value ? Number(clientEl.value) : null,
      }),
    });
    const list = await res.json();
    if (!res.ok) throw new Error(list.error || 'Could not save that search');
    savedSearches = list;
    renderSavedSearches();
    showToast(`Saved. Rotunda re-runs \u201c${name}\u201d every morning and tells you what's new.`);
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  }
}

</script>
