
<div class="page-head">
  <div>
    <h1>Your Profile</h1>
    <p class="sub">Your CAL-ACCESS registration details — used to pre-fill disclosure forms.</p>
  </div>
</div>
<div id="loading"><span class="spinner"></span>Loading…</div>
<div id="error" role="alert" aria-live="assertive"></div>
<div id="content"></div>

<div class="panel" style="margin-top:1rem" id="roster-panel" hidden>
  <div class="panel-head">
    <div>
      <div class="title">Lobbyists at this firm</div>
      <div class="sub">Listed on Part I of every Form 601 you prepare from here.</div>
    </div>
  </div>
  <div id="roster"></div>
  <div style="padding:0.8rem 1.15rem">
    <form id="add-lobbyist-f">
      <label for="lobbyist-name" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Lobbyist name</label>
      <input id="lobbyist-name" placeholder="Full legal name" required style="flex:1;min-width:10rem">
      <label for="lobbyist-cert" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Certification ID</label>
      <input id="lobbyist-cert" placeholder="Certification ID (optional)" style="flex:1;min-width:8rem">
      <button type="submit">Add</button>
    </form>
  </div>
</div>

<script src="{{CONFIRM_DELETE_SRC}}"></script>
<script>
const contentEl = document.getElementById('content');
const errorEl = document.getElementById('error');
const loadingEl = document.getElementById('loading');

function row(label, value) {
  if (!value) return '';
  return `<div style="display:grid;grid-template-columns:11rem 1fr;padding:0.45rem 0;border-bottom:1px solid var(--rule)">
    <div class="sub" style="margin:0">${label}</div><div>${value}</div>
  </div>`;
}

// bus_phone is stored exactly as typed, with no format enforced on
// entry — this only reformats a clean 10-digit US number for display,
// e.g. "5082157570" -> "(508) 215-7570". Anything else (an extension,
// a non-US number, a partial digit string) passes through unchanged
// rather than being mangled by a formatter that assumed too much.
function formatPhone(raw) {
  if (!raw) return raw;
  const digits = raw.replace(/\D/g, '');
  if (digits.length !== 10) return raw;
  return `(${digits.slice(0, 3)}) ${digits.slice(3, 6)}-${digits.slice(6)}`;
}

async function load() {
  try {
    const [meRes, profileRes] = await Promise.all([fetch('/api/me'), fetch('/api/profile')]);
    const me = await meRes.json();
    const { profile } = await profileRes.json();

    if (!profile) {
      contentEl.innerHTML = `
        <div class="panel" style="padding:1.5rem">
          <p class="empty">You haven't filled in your registration details yet.</p>
          <button type="button" onclick="window.location.href='/signup/profile'" style="margin-top:0.8rem">Add registration details →</button>
        </div>
      `;
      loadingEl.className = '';
      return;
    }

    const mailing = profile.mail_same_as_bus
      ? 'Same as business address'
      : [profile.mail_addr1, profile.mail_city, profile.mail_st, profile.mail_zip4].filter(Boolean).join(', ');

    contentEl.innerHTML = `
      <div class="card">
        <div class="bill-id">${me.email || ''}</div>
        <div class="bill-title">${profile.legal_name}</div>
        <span class="tag">${profile.registrant_type === 'firm' ? 'Firm' : 'Individual lobbyist'}</span>
      </div>
      <div class="panel" style="margin-top:1rem">
        <div class="panel-head"><div class="title">Registration details</div></div>
        <div style="padding:0 1.15rem">
          ${row('Business address', [profile.bus_addr1, profile.bus_city, profile.bus_st, profile.bus_zip4].filter(Boolean).join(', '))}
          ${row('Mailing address', mailing)}
          ${row('Phone', formatPhone(profile.bus_phone))}
          ${row('CA SOS filer ID', profile.existing_filer_id)}
        </div>
        <div class="card-actions" style="padding:1rem 1.15rem">
          <button type="button" class="secondary" onclick="window.location.href='/signup/profile'">Edit →</button>
        </div>
      </div>
    `;
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  } finally {
    loadingEl.className = '';
  }
}

/* ── The firm's lobbyists ───────────────────────────────────────────────
 *
 * Form 601 exists to register a firm's lobbyists, and until an
 * organization sat above the account there was exactly one name this app
 * could put on it — the registrant's own. The roster lives here rather
 * than inside the disclosure flow because it's a fact about the firm,
 * not about one filing, and every 601 prepared from now on reads it.
 *
 * An empty roster is not an error: a solo lobbyist's own name still
 * fills the first slot, which is what every filing before this did.
 */
let roster = [];

async function loadRoster() {
  try {
    const res = await fetch('/api/org-lobbyists');
    if (!res.ok) return;
    roster = await res.json();
    renderRoster();
  } catch (err) { /* The rest of the page is unaffected. */ }
}

function renderRoster() {
  document.getElementById('roster-panel').hidden = false;
  const listEl = document.getElementById('roster');
  if (!roster.length) {
    listEl.innerHTML = '<p class="empty" style="padding:0.8rem 1.15rem">No one listed yet. Form 601 falls back to your own registered name.</p>';
    return;
  }
  listEl.innerHTML = roster.map(l => `
    <div class="saved-row">
      <div class="saved-main">
        <div style="font-size:0.9rem;font-weight:600">${escapeText(l.name)}</div>
        ${l.cert_id ? `<div class="saved-meta">Certification ${escapeText(l.cert_id)}</div>` : ''}
      </div>
      <button type="button" class="icon-btn" onclick="removeLobbyist(${l.id})" aria-label="Remove lobbyist" title="Remove">×</button>
    </div>
  `).join('');
}

function escapeText(text) {
  return String(text == null ? '' : text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

document.getElementById('add-lobbyist-f').addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.className = '';
  const nameEl = document.getElementById('lobbyist-name');
  const certEl = document.getElementById('lobbyist-cert');
  try {
    const res = await fetch('/api/org-lobbyists', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: nameEl.value, cert_id: certEl.value }),
    });
    const list = await res.json();
    if (!res.ok) throw new Error(list.error || 'Could not add that lobbyist');
    roster = list;
    renderRoster();
    nameEl.value = ''; certEl.value = '';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  }
});

async function removeLobbyist(id) {
  const person = roster.find(l => l.id === id);
  const ok = await confirmDelete(
    'Remove lobbyist?',
    `Remove ${person ? person.name : 'this person'} from the firm's roster? Filings already prepared keep the names they were built with.`
  );
  if (!ok) return;
  errorEl.className = '';
  try {
    const res = await fetch(`/api/org-lobbyists?id=${id}`, { method: 'DELETE' });
    const list = await res.json();
    if (!res.ok) throw new Error(list.error || 'Could not remove that lobbyist');
    roster = list;
    renderRoster();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  }
}

load();
loadRoster();
</script>
