
<div class="page-head"><div><a href="/disclosures" class="sub">← Disclosures</a></div></div>
<div id="error" role="alert" aria-live="assertive"></div>
<div id="loading" class="show"><span class="spinner"></span>Loading…</div>
<div id="content"></div>

<script src="{{CONFIRM_DELETE_SRC}}"></script>
<script>
// A friendly "Aug 21, 2:03 PM" instead of the raw
// "2026-08-21T14:03:00" ISO string the API returns.
function fmtDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso.includes('Z') || iso.includes('+') ? iso : iso + 'Z');
  if (isNaN(d)) return iso;
  return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[c]);
}

const errorEl = document.getElementById('error');
const contentEl = document.getElementById('content');
const filingId = new URLSearchParams(window.location.search).get('id');
const FORM_LABELS = { "601": "Form 601 — Lobbying Firm Registration Statement" };
const ROW_KEYS = ['employer', 'description', 'effective', 'period', 'agencies'];

let filing = null;
let allClients = [];

function showError(message) {
  errorEl.textContent = message;
  errorEl.className = 'show';
}

async function load() {
  if (!filingId) {
    showError('Missing filing id in the URL.');
    document.getElementById('loading').className = '';
    return;
  }
  try {
    const [filingRes, clientsRes] = await Promise.all([
      fetch(`/api/prepared-filings?id=${filingId}`),
      fetch('/api/clients'),
    ]);
    if (filingRes.status === 401 || clientsRes.status === 401) { window.location.href = '/login'; return; }
    const filingData = await filingRes.json();
    if (!filingRes.ok) throw new Error(filingData.error || 'Could not load this filing');
    allClients = await clientsRes.json();
    filing = filingData;
    render();
  } catch (err) {
    showError(err.message);
  } finally {
    document.getElementById('loading').className = '';
  }
}

// Every mutation (a field autosave, a client-row selection, generating
// the PDF, signing off) gets the full updated filing back from the
// server and just re-renders from it — one source of truth for whether
// the PDF preview is stale, rather than the frontend trying to track
// that itself. See docs/disclosure-html-editor-plan.md's "Staleness
// guard": pdf_current is computed server-side, never assumed here.
async function postJson(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) {
    const message = (data.field_errors && data.field_errors.length)
      ? data.field_errors.join(' ')
      : (data.error || 'Something went wrong.');
    throw new Error(message);
  }
  return data;
}

async function saveField(inputEl) {
  const key = inputEl.dataset.fieldKey;
  const value = inputEl.value;
  if (value === inputEl.dataset.orig) return;  // dirty-check — nothing actually changed, skip the round trip
  inputEl.disabled = true;
  try {
    filing = await postJson('/api/prepared-filings/field', { id: Number(filingId), field_key: key, value });
    render();
  } catch (err) {
    showError(err.message);
    inputEl.disabled = false;
    inputEl.focus();
  }
}

async function generatePdf() {
  const btn = document.getElementById('generate-btn');
  btn.disabled = true;
  try {
    filing = await postJson('/api/prepared-filings/generate-pdf', { id: Number(filingId) });
    render();
  } catch (err) {
    showError(err.message);
  } finally {
    btn.disabled = false;
  }
}

async function signOff(e) {
  e.preventDefault();
  const signedName = document.getElementById('signed_name').value.trim();
  const confirmed = document.getElementById('confirmed_accurate').checked;
  const btn = document.getElementById('sign-btn');
  btn.disabled = true;
  try {
    filing = await postJson('/api/prepared-filings/sign', {
      id: Number(filingId), signed_name: signedName, confirmed_accurate: confirmed,
    });
    render();
  } catch (err) {
    showError(err.message);
    btn.disabled = false;
  }
}

// Same deletion pattern as the Clients section's removeClient() (see
// CLIENTS_BODY / CLIENT_DETAIL_BODY) — the shared confirmDelete()
// dialog naming what's about to be lost (no undo, see
// CONFIRM_DELETE_JS), then a DELETE call, then leave this page since
// there's nothing left here to show.
async function removeFiling() {
  const label = FORM_LABELS[filing.form_type] || ('Form ' + filing.form_type);
  const signedNote = filing.status === 'ready_to_file' ? ' This also removes its sign-off record.' : '';
  const ok = await confirmDelete('Remove draft?', `Remove this ${label} draft?${signedNote} This can't be undone.`);
  if (!ok) return;
  try {
    const res = await fetch(`/api/prepared-filings?id=${filingId}`, { method: 'DELETE' });
    if (!res.ok) {
      const data = await res.json();
      throw new Error(data.error || 'Could not delete this filing');
    }
    window.location.href = '/disclosures';
  } catch (err) {
    showError(err.message);
  }
}

function fieldInputHtml(field, value) {
  const type = field.kind === 'email' ? 'email' : 'text';
  const mark = field.required ? ' <span style="color:var(--bad,#c0392b)">*</span>' : '';
  return `
    <label style="display:block;margin-bottom:0.8rem">
      <div class="sub" style="margin:0 0 0.3rem">${escapeHtml(field.label)}${mark}</div>
      <input type="${type}" data-field-key="${escapeHtml(field.key)}" data-orig="${escapeHtml(value)}"
             value="${escapeHtml(value)}" style="width:100%" onblur="saveField(this)">
    </label>`;
}

/* ── Client rows (P1-20) ───────────────────────────────────────────────
 *
 * The paper form has nine fixed client rows, and this screen used to
 * reproduce all nine as screen rows: three filled blocks, then "Row 4 —
 * empty" through "Row 9 — empty", each rendering five inputs. Roughly
 * thirty blank fields stood between the last real client and the
 * Generate PDF button, and the three blocks that needed attention
 * looked exactly like the six that didn't.
 *
 * A blank row on paper is a place to write. On screen it is nothing —
 * so only rows that hold something are rendered, and adding a client is
 * an explicit act. The nine-row structure still goes to the PDF, where
 * it belongs: pdf_forms.client_row_values() always writes all nine,
 * blanking the ones with no client.
 */
function clientRowIndexes() {
  const rowIds = filing.client_row_ids || [];
  const rowFields = filing.client_row_fields;
  const shown = [];
  for (let i = 0; i < rowFields.length; i++) {
    // A row is shown if a client sits in it, or if it holds typed data
    // with no client — which happens if a client is removed from the
    // form after something was written into its row. Hiding that would
    // hide the only copy of it.
    const hasData = ROW_KEYS.some(k => (filing.field_data[rowFields[i][k]] || '').trim());
    if (rowIds[i] || hasData) shown.push(i);
  }
  return shown;
}

function clientsSectionHtml() {
  const maxRows = filing.max_client_rows;
  const rowFields = filing.client_row_fields;
  const rowIds = filing.client_row_ids || [];
  const rowLabels = filing.field_schema.find(s => s.key === 'clients').row_field_labels;
  const shown = clientRowIndexes();

  const rowsHtml = shown.map(i => {
    const clientId = rowIds[i];
    const client = allClients.find(c => c.id === clientId);
    const heading = client ? escapeHtml(client.name) : 'Typed into row ' + (i + 1) + ' — no client assigned';
    // Row numbers are what the PDF and the paper form speak in, so the
    // row keeps its number even though the screen no longer counts in
    // them — a reviewer checking the generated form against this screen
    // is matching row 7 to row 7.
    const removeBtn = client
      ? `<button type="button" class="icon-btn" title="Remove ${escapeHtml(client.name)} from this form"
           aria-label="Remove ${escapeHtml(client.name)} from this form" onclick="removeClientRow(${client.id})">×</button>`
      : '';
    const fieldsHtml = ROW_KEYS.map(k => fieldInputHtml(
      { key: rowFields[i][k], label: rowLabels[k], required: false, kind: 'text' },
      filing.field_data[rowFields[i][k]] || '',
    )).join('');
    return `<div class="card" style="margin-bottom:0.8rem">
      <div class="client-row-head">
        <div class="bill-title" style="margin:0">${heading}</div>
        <div class="client-row-meta"><span class="sub">Row ${i + 1}</span>${removeBtn}</div>
      </div>${fieldsHtml}</div>`;
  }).join('');

  const onForm = new Set(rowIds.filter(Boolean));
  const available = allClients.filter(c => !onForm.has(c.id));
  const full = onForm.size >= maxRows;

  let addHtml;
  if (full) {
    addHtml = `<div class="sub">All ${maxRows} rows on this form are taken. The real form continues on
      its own attachment pages — remove a client here, or write the rest onto the printed continuation rows.</div>`;
  } else if (!available.length) {
    addHtml = `<div class="sub">${allClients.length
      ? 'Every client you have is on this form.'
      : 'You have no clients yet. Add them under Clients and they can be put on this form.'}</div>`;
  } else {
    addHtml = `
      <label class="sub" style="margin:0">Add
        <select id="add-client-select">
          ${available.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}
        </select>
      </label>
      <button type="button" class="secondary" onclick="addClientRow()">+ Add another client</button>`;
  }

  const emptyHtml = shown.length ? '' :
    '<p class="sub" style="margin:0 0 0.8rem">No clients on this form yet. The form needs at least one.</p>';

  return `${emptyHtml}${rowsHtml}<div class="client-row-add">${addHtml}</div>`;
}

// Both of these go through the same endpoint the row picker used: send
// the whole client list in row order and let the server rebuild the
// rows from it. Adding appends to the first free row; removing closes
// the gap, so the rows stay contiguous and the PDF has no hole in the
// middle of Section A.
async function setClientRows(clientIds) {
  errorEl.className = '';
  try {
    filing = await postJson('/api/prepared-filings/select-clients', {
      id: Number(filingId), client_ids: clientIds,
    });
    render();
  } catch (err) {
    showError(err.message);
  }
}

function addClientRow() {
  const select = document.getElementById('add-client-select');
  if (!select || !select.value) return;
  const rowIds = (filing.client_row_ids || []).filter(Boolean);
  setClientRows(rowIds.concat([Number(select.value)]));
}

async function removeClientRow(clientId) {
  const client = allClients.find(c => c.id === clientId);
  // Named, and honest about what survives: the row's typed values go
  // with it, and the client itself is untouched.
  const ok = await confirmDelete(
    'Remove from this form?',
    `Take ${client ? client.name : 'this client'} off this Form 601? Anything typed into its row goes too. ` +
    'The client itself stays in your Clients list.'
  );
  if (!ok) return;
  setClientRows((filing.client_row_ids || []).filter(id => id && id !== clientId));
}

// When this is due, and the date that starts the clock.
//
// The qualifying date is asked for rather than assumed: it's a fact about
// the firm that this app has no way to know, and a deadline counted from
// when someone happened to open a draft would be wrong while looking
// authoritative. Same reasoning as the "Known gaps" card above — the due
// date it derives is stated as derived, and stays editable, because the
// statutory reading belongs to the lobbyist and not to this app.
function deadlineCardHtml() {
  const rule = filing.deadline_rule;
  const triggerLabel = (rule && rule.trigger_label) || 'Date the clock starts';
  const help = rule ? rule.trigger_help : 'Enter the date this filing is due.';
  const derived = rule && filing.trigger_date && filing.due_date;
  return `
    <div class="card">
      <h2 class="section" style="margin-top:0">Filing deadline</h2>
      <div class="sub" style="margin:0 0 0.8rem">${help}</div>
      <div style="display:flex;gap:1rem;flex-wrap:wrap">
        <label style="flex:1;min-width:11rem">
          <div class="sub" style="margin-bottom:0.25rem">${triggerLabel}</div>
          <input type="date" id="trigger_date" value="${filing.trigger_date || ''}"
                 style="width:100%" onchange="saveDeadline()">
        </label>
        <label style="flex:1;min-width:11rem">
          <div class="sub" style="margin-bottom:0.25rem">Due date</div>
          <input type="date" id="due_date" value="${filing.due_date || ''}"
                 style="width:100%" onchange="saveDeadline(true)">
        </label>
      </div>
      <div class="sub" id="deadline-note" style="margin-top:0.5rem">${
        derived ? `Derived: ${rule.rule_label}. Edit the due date directly if your reading differs.`
                : "No due date set, so this filing won't appear on any countdown."
      }</div>
    </div>
  `;
}

// overrideDue=true means the user edited the due date itself, so it's
// sent as-is instead of being recomputed out from under them.
async function saveDeadline(overrideDue) {
  const trigger = document.getElementById('trigger_date').value;
  const due = document.getElementById('due_date').value;
  errorEl.className = '';
  try {
    const res = await fetch('/api/prepared-filings/deadline', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: filingId, trigger_date: trigger, due_date: overrideDue ? due : '' }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not save the deadline.');
    filing = data;
    render();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.className = 'show';
  }
}

function render() {
  const pdfUrl = `/api/prepared-filings/pdf?id=${filing.id}`;
  const signed = filing.status === 'ready_to_file';
  const statusBadge = signed
    ? '<span class="status-badge good">Signed off</span>'
    : (filing.pdf_current ? '<span class="status-badge">Draft — PDF up to date</span>' : '<span class="status-badge">Draft — editing</span>');

  const businessSection = filing.field_schema.find(s => s.key === 'business');
  const businessFieldsHtml = businessSection.fields.map(f => fieldInputHtml(f, filing.field_data[f.key] || '')).join('');

  const pdfSection = filing.pdf_current ? `
    <div class="card" style="padding:0;overflow:hidden">
      <iframe src="${pdfUrl}" style="width:100%;height:70vh;border:none" title="Filled ${filing.form_type} preview"></iframe>
    </div>
    <div class="card-actions" style="margin:-0.5rem 0 1.5rem">
      <a class="secondary" href="${pdfUrl}" target="_blank" rel="noopener">Open PDF in a new tab →</a>
    </div>
  ` : `
    <div class="sub" style="margin:0 0 1.5rem">Generate the PDF to preview it before signing off.</div>
  `;

  const signOffSection = signed ? `
    <div class="card">
      <div class="bill-title" style="margin-bottom:0.4rem">Signed off</div>
      <div class="bill-desc">Confirmed accurate by <strong>${escapeHtml(filing.signed_name)}</strong> on ${fmtDateTime(filing.signed_at)}.</div>
      <div class="sub" style="margin:0.6rem 0 0">This app has not filed anything. Download the PDF above and file it yourself with the FPPC / Secretary of State. Editing any field above reopens this filing for another round of sign-off.</div>
    </div>
  ` : (filing.pdf_current ? `
    <div class="card">
      <div class="bill-title" style="margin-bottom:0.4rem">Sign-off — required before this can be marked ready to file</div>
      <form id="sign-form" onsubmit="signOff(event)">
        <label style="flex:1 1 100%">
          <div class="sub" style="margin:0 0 0.3rem">Type your full legal name to confirm</div>
          <input id="signed_name" required style="width:100%">
        </label>
        <label style="flex:1 1 100%;display:flex;align-items:flex-start;gap:0.5rem;margin-top:0.8rem;font-size:0.9rem">
          <input type="checkbox" id="confirmed_accurate" required style="margin-top:0.2rem;width:auto">
          <span>I confirm the information in this form is accurate to the best of my knowledge.</span>
        </label>
        <button type="submit" id="sign-btn" style="margin-top:1rem">Mark ready to file</button>
      </form>
      <div class="sub" style="margin-top:0.8rem">This only marks the draft reviewed on your end — it does not submit or send anything anywhere.</div>
    </div>
  ` : '');

  contentEl.innerHTML = `
    <div class="page-head">
      <div>
        <h1>${FORM_LABELS[filing.form_type] || ('Form ' + filing.form_type)}</h1>
        <p class="sub">${filing.period_label ? 'Period: ' + filing.period_label + ' — ' : ''}Prepared ${fmtDateTime(filing.created_at)}.</p>
        <div style="margin-top:0.6rem">${statusBadge}</div>
      </div>
      <button type="button" class="danger" onclick="removeFiling()">Delete draft</button>
    </div>

    <div class="card">
      <div class="bill-title" style="margin-bottom:0.4rem">Known gaps in this draft</div>
      <div class="bill-desc">
        This app doesn't collect every field the real form asks for. Left blank on purpose, rather than
        guessed: subcontracted-client information, and any individual lobbyists past the six listed here
        (add them to your firm's roster on Profile, or write them onto the printed form's continuation
        rows). Fill those in by hand if they apply to you.
      </div>
    </div>

    ${deadlineCardHtml()}

    <div class="card">
      <h2 class="section" style="margin-top:0">Business information</h2>
      <div class="sub" style="margin:0 0 0.8rem">Edits save automatically as you leave each field.</div>
      ${businessFieldsHtml}
    </div>

    <div class="card">
      <h2 class="section" style="margin-top:0">Clients</h2>
      ${clientsSectionHtml()}
    </div>

    <div class="sticky-actions">
      <span class="sub" style="margin:0">${signed ? 'Signed off — regenerate if you edit anything.'
        : (filing.pdf_current ? 'PDF matches what is on this page.' : 'Generate the PDF to preview it before signing off.')}</span>
      <button type="button" id="generate-btn" onclick="generatePdf()">Generate PDF</button>
    </div>

    ${pdfSection}
    ${signOffSection}
  `;
}

load();
</script>
